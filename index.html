/* ---------- drawing ---------- */
function drawRetro(t) {          // dark green retro background for the menus
  const s = t / 1000, hz = H * .46;
  ctx.fillStyle = "#04100a"; ctx.fillRect(0, 0, W, H);
  let g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#020a06"); g.addColorStop(1, "#0f3d25");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);
  for (let i = 0; i < 46; i++) {                       // twinkling pixel stars
    ctx.fillStyle = "rgba(150,255,190," + (.2 + .4 * Math.sin(s * 2 + i * 1.7)) + ")";
    ctx.fillRect((i * 173) % W, (i * 97) % (hz - 40), 2, 2);
  }
  ctx.save(); ctx.beginPath(); ctx.arc(W / 2, hz, 170, Math.PI, 0); ctx.clip();   // striped sun
  g = ctx.createLinearGradient(0, hz - 170, 0, hz);
  g.addColorStop(0, "#2f9a5c"); g.addColorStop(1, "#14602f");
  ctx.fillStyle = g; ctx.fillRect(W / 2 - 170, hz - 170, 340, 170);
  ctx.fillStyle = "#0b2f1b";
  for (let k = 0; k < 7; k++) ctx.fillRect(W / 2 - 170, hz - 8 - k * 22, 340, 3 + (6 - k) * 1.6);
  ctx.restore();
  g = ctx.createLinearGradient(0, hz, 0, H);           // floor with a moving grid
  g.addColorStop(0, "#0d3a22"); g.addColorStop(1, "#030c07");
  ctx.fillStyle = g; ctx.fillRect(0, hz, W, H - hz);
  ctx.strokeStyle = "rgba(70,220,120,.35)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = -16; i <= 16; i++) { ctx.moveTo(W / 2 + i * 22, hz); ctx.lineTo(W / 2 + i * 120, H); }
  for (let j = 0; j < 12; j++) {
    const p = (j + (s * .6) % 1) / 12, y = hz + (H - hz) * p * p;
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.fillStyle = "rgba(90,255,150,.5)"; ctx.fillRect(0, hz - 1, W, 2);
  const v = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 640);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.65)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// One paddle body. dx / dy are the stretch, thin is the quick impact flex. fn is the skin's draw function.
function paddleBody(x, y, a, w, h, dx, dy, thin, alpha, fn) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(a); ctx.scale(dx * (1 - .3 * thin), dy);
  fn(ctx, w, h, performance.now() / 1000);
  ctx.restore();
}

// Which skin a paddle wears: yours is your equipped one; in online matches your opponent's shows their own
function skinOf(p) {
  if (!online()) return p === player ? shop.eq.paddle : "classic";
  const isMine = (p === player) === (net.role !== "guest");
  const id = isMine ? shop.eq.paddle : net.oppPaddle;
  return own(PADDLES, id) ? id : "classic";
}

function drawPaddle(p) {
  const fn = PADDLES[skinOf(p)].draw;
  p.gh.forEach(g => paddleBody(g.x, g.y, g.a, p.w, p.h, g.dx, g.dy, 0, g.l * .28, fn));   // motion smear while spinning
  const f = p.ik * p.ik * (3 - 2 * p.ik);               // smoothstep for the impact flex
  paddleBody(p.x, p.y, p.angle, p.w, p.h, p.dx, p.dy, f, 1, fn);
  if (p.sk > 0) {                                       // Paddle Decay: a red flash around the paddle each time it shrinks
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.strokeStyle = "rgba(255,80,60," + (p.sk / .35) + ")"; ctx.lineWidth = 3; ctx.strokeRect(-PW(p) / 2 - 3, -PH(p) / 2 - 3, PW(p) + 6, PH(p) + 6);
    ctx.restore();
  }
  if (debug) {                                          // the real hitbox
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.strokeStyle = "#ff5a4a"; ctx.lineWidth = 1; ctx.strokeRect(-PW(p) / 2, -PH(p) / 2, PW(p), PH(p));
    ctx.restore();
  }
}

function ring(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
}

// Smash meter: one segment per hit needed (4 normally, 2 in Smash Fever). x is the edge it lines up with.
function drawMeter(p, x, right) {
  const need = smashNeed(), full = p.charge >= need, w = 90, x0 = right ? x - w : x, sg = (w - (need - 1) * 2) / need;
  const pulse = full ? .7 + .3 * Math.sin(performance.now() / 110) : 1;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x0 - 2, 40, w + 4, 12);
  ctx.save(); ctx.globalAlpha = pulse;
  for (let i = 0; i < need; i++) {
    ctx.fillStyle = i < p.charge ? (full ? "#ffb36b" : "#d5ad54") : "#2b2a22";
    ctx.fillRect(x0 + i * (sg + 2), 42, sg, 8);
  }
  ctx.textAlign = right ? "right" : "left"; ctx.font = "15px VT323";
  ctx.fillStyle = full ? "#ffb36b" : "#8d856f";
  ctx.fillText(full ? "SMASH READY" : "SMASH " + p.charge + "/" + need, x, 66);
  ctx.restore();
}

// Live rally counter: every hit gets its own arcade burst (fade in, overshoot, settle, fade away).
function drawCombo() {
  if (M.rally <= 0 || comboT <= 0) return;
  const hitAge = clamp((.42 - comboPop) / .42, 0, 1);
  const zoom = S.anim
    ? (hitAge < .48
      ? .62 + .72 * (hitAge / .48)
      : 1.34 - .34 * ((hitAge - .48) / .52))
    : 1;
  const inA = clamp(hitAge / .12, 0, 1);
  const outA = clamp(comboT / .34, 0, 1);
  const fade = Math.min(inA, outA);
  ctx.save();
  ctx.translate(W - 58, 92);
  ctx.scale(zoom, zoom);
  ctx.textAlign = "right";
  ctx.globalAlpha = fade;
  ctx.font = '9px "Press Start 2P"'; ctx.fillStyle = "#d5ad54";
  ctx.fillText("RALLY", 0, -4);
  ctx.font = '18px "Press Start 2P"'; ctx.fillStyle = M.rally >= 4 ? "#ffb36b" : "#f2e8c9";
  ctx.fillText("x" + M.rally, 0, 18);
  ctx.restore();
}

// Your coins in the bottom-left corner, with this match's earnings next to them
function drawWallet() {
  ctx.save(); ctx.textAlign = "left";
  const g = ctx.createRadialGradient(32, H - 29, 1, 34, H - 26, 9);
  g.addColorStop(0, "#fff2a8"); g.addColorStop(.6, "#d5ad54"); g.addColorStop(1, "#8a6417");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(34, H - 26, 8, 0, Math.PI * 2); ctx.fill();
  ctx.font = '13px "Press Start 2P"'; ctx.fillStyle = "#d5ad54"; ctx.fillText(shop.coins, 50, H - 21);
  if (M.coins > 0) { ctx.fillStyle = "#8be0a0"; ctx.fillText("+" + M.coins, 50 + ctx.measureText(String(shop.coins)).width + 12, H - 21); }
  ctx.restore();
}

// Score numbers pop bigger for a moment when they change
function drawScore(n, x, t) {
  const s = t > 0 && S.anim ? 1 + .55 * Math.sin((1 - t / .45) * Math.PI) : 1;
  ctx.save(); ctx.translate(x, 52); ctx.scale(s, s); ctx.fillText(n, 0, 15); ctx.restore();
}

// The ball keeps its skin the whole time (even after a smash). It stretches along its path,
// squashes against whatever it hits, then springs back fast.
function drawBall(b) {
  const va = Math.atan2(b.vy, b.vx);
  ctx.save(); ctx.translate(b.x, b.y);
  let fr = 0;
  if (S.anim) {
    const sp = Math.hypot(b.vx, b.vy), st = 1 + clamp(sp / 3600, 0, .25);
    ctx.rotate(va); ctx.scale(st, 1 / Math.sqrt(st)); fr = va;
    if (b.sm) {
      const s = b.sm * Math.exp(-b.ht * 20) * Math.cos(b.ht * 26);
      ctx.rotate(b.sa - va); fr = b.sa;
      ctx.scale(Math.max(.32, 1 - .65 * s), Math.min(1.7, 1 + .42 * s));
    }
  }
  BALLS[shop.eq.ball].draw(ctx, b.r, performance.now() / 1000, b.roll, va - fr);
  ctx.restore();
}

function drawCourt() { paintCourt(ctx, COURTS[shop.eq.court], W, H, WALL); }

// Shrinks text until it fits in maxW pixels; returns the size used
function fitText(txt, maxW, px, fam) {
  let s = px; ctx.font = s + "px " + fam;
  while (ctx.measureText(txt).width > maxW && s > 8) { s--; ctx.font = s + "px " + fam; }
  return s;
}

// Labels above each paddle: P1 / P2 / CPU, or YOU / OPP in online matches
function sideNames() {
  if (net.role === "host") return ["YOU", "OPP"];
  if (net.role === "guest") return ["OPP", "YOU"];
  return ["P1", localMode() ? "P2" : "CPU"];
}

function drawGame() {
  ctx.save();
  if (S.shake && shakeT > 0) { const a = shakeT * 28; ctx.translate((Math.random() - .5) * a, (Math.random() - .5) * a); }
  drawCourt();

  if (has("wrap")) {                                 // dashed cyan edges show that the ball passes straight through
    ctx.strokeStyle = "rgba(120,220,255,.6)"; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.beginPath();
    ctx.moveTo(WALL, wy); ctx.lineTo(W - WALL, wy); ctx.moveTo(WALL, H - wy); ctx.lineTo(W - WALL, H - wy);
    ctx.stroke(); ctx.setLineDash([]);
  }
  if (has("lanes")) {                                // boost lanes along the top and bottom
    const now = performance.now() / 1000;
    [[wy, wy + LANE, 1], [H - wy - LANE, H - wy, -1]].forEach(([y0, y1, dir]) => {
      ctx.fillStyle = "rgba(255,196,90,.07)"; ctx.fillRect(WALL, y0, W - WALL * 2, y1 - y0);
      ctx.strokeStyle = "rgba(255,196,90,.4)"; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath();
      const ly = dir > 0 ? y1 : y0; ctx.moveTo(WALL, ly); ctx.lineTo(W - WALL, ly); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255,196,90,.5)"; ctx.beginPath();
      for (let k = 0; k < 12; k++) {
        const x = ((now * 110 * dir + k * 80) % (W + 80) + (W + 80)) % (W + 80) - 40, y = (y0 + y1) / 2;
        ctx.moveTo(x - 6 * dir, y - 9); ctx.lineTo(x + 6 * dir, y); ctx.lineTo(x - 6 * dir, y + 9);
      }
      ctx.stroke();
    });
  }
  if (has("gravity")) {
    ctx.beginPath(); ctx.arc(W / 2, H / 2, cf().gravR, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(76,125,104,.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(198,218,177,.48)"; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 13 + Math.sin(performance.now() / 180) * 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(218,224,188,.55)"; ctx.fill();
  }
  if (has("slow")) {
    ctx.fillStyle = "rgba(120,160,220,.09)"; ctx.fillRect(W / 2 - SLOWW, WALL, SLOWW * 2, H - WALL * 2);
    ctx.strokeStyle = "rgba(150,190,240,.3)"; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.moveTo(W / 2 - SLOWW, WALL); ctx.lineTo(W / 2 - SLOWW, H - WALL);
    ctx.moveTo(W / 2 + SLOWW, WALL); ctx.lineTo(W / 2 + SLOWW, H - WALL); ctx.stroke(); ctx.setLineDash([]);
  }
  if (has("magnet")) {                               // field lines drifting outward from both paddles
    const now = performance.now() / 1000; ctx.lineWidth = 2;
    [[player, 0], [cpu, Math.PI]].forEach(([p, base]) => {
      for (let k = 0; k < 3; k++) {
        const ph = fract(now * .6 + k / 3);
        ctx.strokeStyle = "rgba(120,200,255," + (.25 * (1 - ph)) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, 30 + ph * 110, base - .9, base + .9); ctx.stroke();
      }
    });
  }
  if (has("portal")) PORTALS.forEach((o, i) => {
    const col = i ? "#ffa24a" : "#6fb7ff";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (.45 + .15 * Math.sin(performance.now() / 160 + i)), 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.globalAlpha = .45; ctx.fill(); ctx.globalAlpha = 1;
    if (debug) ring(o.x, o.y, o.r, "#ff5a4a");
  });
  if (has("bumpers")) bumpers().forEach(b => {
    [[b.r, "#d5ad54"], [b.r - 6, "#514b35"], [b.r - 11, "#e5d59b"]].forEach(([r, c]) => {
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
    });
    if (debug) ring(b.x, b.y, b.r, "#ff5a4a");
  });
  if (has("barrier")) {
    ctx.fillStyle = "#d5ad54"; ctx.fillRect(barrier.x - barrier.w / 2, barrier.y - barrier.h / 2, barrier.w, barrier.h);
    if (debug) { ctx.strokeStyle = "#ff5a4a"; ctx.strokeRect(barrier.x - barrier.w / 2, barrier.y - barrier.h / 2, barrier.w, barrier.h); }
  }
  if (has("pillars")) PILLARS.forEach(p => {
    ctx.fillStyle = "#6d6853"; ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
    ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fillRect(p.x - p.w / 2 + 2, p.y - p.h / 2 + 3, 4, p.h - 6);
    if (debug) { ctx.strokeStyle = "#ff5a4a"; ctx.strokeRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h); }
  });
  if (has("pads")) PADS.forEach(p => {
    const now = performance.now() / 1000;
    ctx.fillStyle = "rgba(255,196,90,.14)"; ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
    ctx.strokeStyle = "rgba(255,196,90,.7)"; ctx.lineWidth = 2; ctx.strokeRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const xx = p.x - p.w / 2 + 6 + ((now * 50 + k * 12) % (p.w - 18));
      ctx.moveTo(xx, p.y - 8); ctx.lineTo(xx + 8, p.y); ctx.lineTo(xx, p.y + 8);
    }
    ctx.stroke();
  });
  if (has("coins")) pickups.forEach(c => {           // spinning coins; they blink just before they vanish
    const now = performance.now() / 1000;
    if (c.life < 1.5 && Math.floor(now * 8) % 2) return;
    ctx.save(); ctx.translate(c.x, c.y + Math.sin(now * 4 + c.id) * 2); ctx.scale(Math.max(.25, Math.abs(Math.cos(now * 3 + c.id))), 1);
    ctx.fillStyle = "#8a6417"; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = "#d5ad54"; ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#f2d27a"; ctx.fillRect(-1.5, -5, 3, 10);
    ctx.restore();
  });
  if (has("closing") && wy > WALL) {
    ctx.fillStyle = "#0c140f"; ctx.fillRect(0, 0, W, wy); ctx.fillRect(0, H - wy, W, wy);
    ctx.fillStyle = "#d94a3a"; ctx.fillRect(0, wy - 4, W, 4); ctx.fillRect(0, H - wy, W, 4);
  }

  drawPaddle(player); drawPaddle(cpu);

  const nmz = sideNames();
  ctx.textAlign = "center";
  ctx.fillStyle = "#e9dfbd"; ctx.font = '42px "Press Start 2P"';
  drawScore(scoreP, W * .43, popP); drawScore(scoreC, W * .57, popC);
  ctx.font = "17px VT323"; ctx.fillStyle = "#cfc6a7";
  ctx.fillText(nmz[0], W * .25, 35); ctx.fillText(nmz[1], W * .75, 35);
  drawCombo();

  if (smashOn()) {                  // smash meters: the left player's left-aligned, the right player's right-aligned
    const pw = ctx.measureText(nmz[0]).width / 2, cw = ctx.measureText(nmz[1]).width / 2;
    drawMeter(player, W * .25 - pw, false);
    drawMeter(cpu, W * .75 + cw, true);
    ctx.textAlign = "center";
  }

  for (const b of balls) {
    const now = performance.now() / 1000, sk = BALLS[shop.eq.ball];
    const a = (has("ghost") ? clamp((Math.abs(b.x - W / 2) - 40) / 150, 0, 1) : 1) * (has("flicker") ? (fract(now * 1.1) < .62 ? 1 : .07) : 1);
    if (sk.trail) {                                   // skin trail, drawn from the ball's recent positions
      ctx.save();
      b.trail.forEach((p, i) => { ctx.globalAlpha = a; sk.trail(ctx, p[0], p[1], i / b.trail.length, b.r, now, i); });
      ctx.restore();
    }
    if (b.smash) {                                    // a smash adds an orange trail, streaks and a ring ON TOP of your skin
      b.trail.forEach((p, i) => {
        const t = i / b.trail.length;
        ctx.globalAlpha = t * .42 * a; ctx.fillStyle = "#ffb36b";
        ctx.beginPath(); ctx.arc(p[0], p[1], b.r * t, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(255,190,120,.55)"; ctx.lineWidth = 2;
      for (let i = 1; i < 7; i++) {
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx * .004 * i, b.y - b.vy * .004 * i);
        ctx.lineTo(b.x - b.vx * .007 * i, b.y - b.vy * .007 * i);
        ctx.stroke();
      }
    }
    if (b.glow > 0 || b.smash) {                      // crisp ring (no blur)
      ctx.save(); ctx.strokeStyle = b.smash ? "#ffb36b" : "#f2e8c9"; ctx.lineWidth = 3; ctx.globalAlpha = .6 * a;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8 + Math.sin(performance.now() / 40) * 2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = a; drawBall(b);
    if (has("wrap")) {                                // while it straddles the edge, show the part that has come out the other side
      const hh = H - wy * 2;
      if (b.y - b.r < wy) drawBall({ ...b, y: b.y + hh }); else if (b.y + b.r > H - wy) drawBall({ ...b, y: b.y - hh });
    }
    ctx.globalAlpha = 1;
    if (debug) ring(b.x, b.y, b.r, "#5affb0");
  }

  if (has("dark") && balls[0]) {
    const b = balls[0], g = ctx.createRadialGradient(b.x, b.y, 40, b.x, b.y, 190);
    g.addColorStop(0, "rgba(3,8,6,0)"); g.addColorStop(1, "rgba(3,8,6,.88)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  vfxList.forEach(v => { ctx.save(); ctx.translate(v.x, v.y); VFX[v.k].draw(ctx, v.t, v.seed, v.pow, v.ang); ctx.restore(); });
  rings.forEach(r => {                              // smash shockwaves, sparks and callouts
    ctx.strokeStyle = "rgba(255,190,110," + (1 - r.t) + ")"; ctx.lineWidth = 6 * (1 - r.t) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 130, 0, Math.PI * 2); ctx.stroke();
  });
  sparks.forEach(s => {
    const k = s.l / s.m;
    if (s.col) { ctx.globalAlpha = k; ctx.fillStyle = s.col; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); ctx.globalAlpha = 1; }
    else { ctx.fillStyle = "rgba(255," + (150 + k * 100 | 0) + ",90," + k + ")"; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
  });
  pops.forEach(p => {
    ctx.save(); ctx.globalAlpha = 1 - p.t; ctx.font = '22px "Press Start 2P"';
    ctx.fillStyle = "#000"; ctx.fillText("SMASH!", p.x + 3, p.y - p.t * 34 + 3);
    ctx.fillStyle = "#ffb36b"; ctx.fillText("SMASH!", p.x, p.y - p.t * 34); ctx.restore();
  });
  coinPops.forEach(p => {                           // "+N" coin pickups float up from where the ball was hit
    ctx.save(); ctx.globalAlpha = 1 - p.t; ctx.textAlign = "center"; ctx.font = (p.big ? '16px' : '11px') + ' "Press Start 2P"';
    ctx.fillStyle = "#000"; ctx.fillText(p.txt, p.x + 2, p.y - p.t * 36 + 2);
    ctx.fillStyle = p.big ? "#ffd877" : "#d5ad54"; ctx.fillText(p.txt, p.x, p.y - p.t * 36); ctx.restore();
  });
  drawWallet();

  ctx.fillStyle = "rgba(232,223,189,.72)"; ctx.textAlign = "center";
  const lbl = "ROUND " + round + "  -  " + modeLabel();
  fitText(lbl, 640, 17, '"Press Start 2P"'); ctx.fillText(lbl, W / 2, H - 25);

  if (ready > 0 && screen === "playing") {       // round banner and countdown
    ctx.save(); ctx.globalAlpha = clamp(ready / .35, 0, 1); ctx.textAlign = "center";
    ctx.fillStyle = "#d5ad54"; ctx.font = '14px "Press Start 2P"'; ctx.fillText("ROUND " + round, W / 2, H / 2 - 150);
    const nm = modeLabel(); ctx.fillStyle = "#f2e8c9"; fitText(nm, 880, 26, '"Press Start 2P"'); ctx.fillText(nm, W / 2, H / 2 - 112);
    ctx.fillStyle = "#c8bfa5"; ctx.font = "22px VT323"; modeInfo().forEach((t, i) => ctx.fillText(t, W / 2, H / 2 - 80 + i * 24));
    ctx.restore();
    if (countdown) {                             // each number pops big, then settles
      const n = Math.ceil(ready / .8), fr = ready / .8 - (n - 1), s = S.anim ? 1 + .7 * fr * fr : 1;
      ctx.save(); ctx.translate(W / 2, H / 2 + 92); ctx.scale(s, s);
      ctx.fillStyle = "#f2e8c9"; ctx.font = '56px "Press Start 2P"'; ctx.fillText(n, 0, 28); ctx.restore();
    }
  }

  if (slowT > 0) {                                 // warm vignette while time is slowed
    const k = slowT / SLOWD, g = ctx.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 620);
    g.addColorStop(0, "rgba(40,15,0,0)"); g.addColorStop(1, "rgba(40,15,0," + (.55 * k) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flashT > 0) { ctx.fillStyle = "rgba(255,240,210," + Math.min(.55, flashT * 3.5) + ")"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

function loop(t) {
  // Allow brief slow frames to catch up instead of silently throwing away all time beyond 30ms.
  const real = Math.min(Math.max(0, (t - last) / 1000), .05);
  last = t;
  const k = slowT / SLOWD, dt = real * (slowT > 0 ? .1 + .9 * (1 - k) * (1 - k) : 1);   // slow-mo scales game time only
  slowT = Math.max(0, slowT - real); flashT = Math.max(0, flashT - real);
  popP = Math.max(0, popP - real); popC = Math.max(0, popC - real);
  comboT = Math.max(0, comboT - real); comboPop = Math.max(0, comboPop - real);
  netTick(real);
  if (screen === "playing") { net.role === "guest" ? updateGuest(dt) : update(dt); fxUpdate(dt); }
  shakeT = Math.max(0, shakeT - real);
  fxStep(real);
  if (screen === "shop") paintShop(t / 1000);        // shop previews animate
  retroOn() ? drawRetro(t) : drawGame();
  requestAnimationFrame(loop);
}

chooseTwist(); serve(1, false);
showScreen("title");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
