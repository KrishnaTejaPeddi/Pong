<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PONG // ARCADE</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>window.mqtt||document.write('<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"><\/script>')</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--cream:#f2e8c9;--red:#d94a3a;--gold:#d5ad54;--phos:#3f8a5c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#11110f;color:var(--cream)}
body{position:relative;display:flex;align-items:center;justify-content:center;font-family:VT323,monospace;background:#020202;overflow-x:hidden}
/* outer arcade surround: dense, dark moving CRT lines */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:repeating-linear-gradient(180deg,#020202 0px,#020202 7px,#252525 8px,#252525 10px);
  background-size:100% 10px;}
@keyframes outerLines{from{background-position:0 0}to{background-position:0 10px}}
.machine{position:relative;z-index:1;width:min(1120px,95vw);background:#25241e;border:8px solid #0b0b09;box-shadow:0 22px 70px #000,inset 0 0 0 3px #464338;padding:26px 30px 24px}
.marquee{text-align:center;padding:5px 0 15px;border-bottom:4px solid #0c0c0b}
.marquee h1{margin:0;font-family:"Press Start 2P",monospace;font-size:clamp(20px,3.3vw,38px);color:var(--red);text-shadow:3px 3px 0 #501e19}
.marquee p{margin:10px 0 0;font-size:21px;letter-spacing:4px;color:#c8bfa5}
.screen-frame{margin:20px auto 0;padding:15px;max-width:1000px;background:#080807;border:4px solid #4b493d;box-shadow:inset 0 0 0 4px #161612,0 7px 0 #0a0a08}
.screen{position:relative;background:#182b23;overflow:hidden;container-type:inline-size}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
#fx{position:absolute;left:0;top:0;height:100%;pointer-events:none;z-index:6}
.scan,.glass{position:absolute;inset:0;pointer-events:none;z-index:7}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.14) 4px);opacity:.55}
.glass{box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.nocrt .scan,.nocrt .glass{display:none}
.toast{position:absolute;left:50%;top:3cqw;transform:translateX(-50%) translateY(-1cqw);z-index:9;pointer-events:none;opacity:0;transition:all .25s;font-family:"Press Start 2P",monospace;font-size:1.2cqw;color:var(--gold);background:#000;border:.3cqw solid var(--phos);padding:.8cqw 1.6cqw;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}

/* control deck under the screen */
.deck{max-width:1000px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 24px;border:3px solid #0b0b09;border-radius:8px;
  background:radial-gradient(circle at 11px 11px,#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at calc(100% - 11px) 11px,#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at 11px calc(100% - 11px),#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at calc(100% - 11px) calc(100% - 11px),#7c7867 0 3px,#2a2923 4px,transparent 5px),linear-gradient(#1c1b15,#12110d);
  box-shadow:inset 0 0 0 2px #3b392f,inset 0 10px 20px rgba(0,0,0,.45),0 4px 0 #0a0a08}
.instructions{font-size:20px;letter-spacing:1px;color:#bdb59e}
.instructions b{color:var(--cream);font-weight:normal}
.ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.abtn{font:20px VT323,monospace;letter-spacing:3px;color:var(--cream);background:#333229;border:2px solid #5a574a;padding:7px 22px;cursor:pointer;box-shadow:3px 3px 0 #0b0b09;transition:all .1s}
.abtn:hover{background:#403f35;border-color:var(--gold);color:var(--gold)}
.abtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0b0b09}
.abtn.paused{color:var(--gold);border-color:var(--gold)}

/* twist picker (custom dropdown) */
.pick{position:relative;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;background:#0b0b09;border:2px solid #4b493d;border-radius:7px;box-shadow:inset 0 2px 6px #000}
.pick>span{font:9px "Press Start 2P",monospace;letter-spacing:1px;color:var(--gold)}
.dd{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:210px;font:20px VT323,monospace;letter-spacing:1px;color:var(--cream);background:#201f19;border:1px solid #5a574a;border-radius:4px;padding:8px 14px;cursor:pointer;transition:all .1s}
.dd:hover,.pick.open .dd{background:#2a2922;border-color:var(--gold);color:var(--gold)}
.dd b{font-weight:normal}
.car{border:5px solid transparent;border-top:7px solid var(--gold);border-bottom:0;transition:transform .15s}
.pick.open .car{transform:rotate(180deg)}
.mpop{position:fixed;left:10px;top:auto;bottom:auto;width:620px;max-height:340px;overflow-y:auto;display:none;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:#000;border:3px solid var(--phos);
  box-shadow:inset 0 0 0 2px #000,inset 0 0 0 4px #1f4d33,0 14px 44px rgba(0,0,0,.85);z-index:50;scrollbar-width:thin;scrollbar-color:#3f8a5c #000}
.mpop.open{display:grid}
.opt{padding:8px 10px;border:1px solid #1f4d33;background:#07130d;cursor:pointer;transition:all .08s;text-align:left}
.opt b{display:block;font:9px "Press Start 2P",monospace;letter-spacing:.5px;color:#bfe8cc;margin-bottom:6px;line-height:1.3}
.opt span{font-size:17px;color:#7fa890;line-height:1}
.opt:hover,.opt.hov{background:#143824;border-color:var(--gold)}
.opt:hover b,.opt.hov b{color:var(--gold)}
.opt.on{border-color:var(--cream);background:#0f2a1c}
.opt.on b:before{content:"";display:inline-block;margin-right:7px;border:4px solid transparent;border-left:6px solid var(--red);border-right:0}
.opt.clash{opacity:.6}
.opt.clash span{color:#c9a46a}

.tweaks{max-width:1000px;margin:14px auto 0;display:none;gap:26px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:#0b0b09;border:2px solid #4b493d;border-radius:7px;box-shadow:inset 0 2px 8px #000}
.tweaks label{display:flex;align-items:center;gap:12px;font:9px "Press Start 2P",monospace;letter-spacing:1px;color:var(--gold)}
.tweaks output{min-width:2.4em;font:20px VT323,monospace;color:var(--cream)}
.tweaks input[type=range]{-webkit-appearance:none;appearance:none;width:160px;height:8px;border-radius:4px;background:#1c1b15;border:1px solid #4b493d;outline:none}
.tweaks input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:24px;border-radius:3px;border:1px solid #0b0b09;background:linear-gradient(#f4dc95,#b88a34);box-shadow:0 2px 0 #7a5a1c;cursor:pointer}
.tweaks input[type=range]::-moz-range-thumb{width:16px;height:22px;border-radius:3px;border:1px solid #0b0b09;background:linear-gradient(#f4dc95,#b88a34);box-shadow:0 2px 0 #7a5a1c;cursor:pointer}
.footer{margin-top:16px;text-align:center;color:#777365;font-size:17px;letter-spacing:2px}

/* menus and screens (sizes use cqw so everything scales with the screen) */
.ui{position:absolute;inset:0;z-index:4;display:none;font-family:VT323,monospace}
.ui.on{display:block}
.ui2{position:absolute;inset:0;z-index:5;pointer-events:none;font-family:VT323,monospace}
.sc{--d:1;--st:70ms;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sc>*{position:relative;z-index:1}
.sc>.shade{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at center,rgba(8,14,11,.45) 0,rgba(5,9,7,.9) 100%);animation:shIn .6s both}
.retro .shade{background:rgba(0,0,0,.1)}
.sc>.rec,.sc>.hint,.sc>.ver,.sc>.wallet{position:absolute}
@keyframes fade{from{opacity:0;transform:translateY(1cqw)}to{opacity:1;transform:none}}
@keyframes glow{50%{text-shadow:.7cqw .7cqw 0 #501e19,0 0 6cqw rgba(217,74,58,.9)}}
@keyframes blink{50%{opacity:.3}}
@keyframes shIn{from{opacity:0}to{opacity:1}}
@keyframes shOut{to{opacity:0}}
@keyframes nope{25%{transform:translateX(-.8cqw)}75%{transform:translateX(.8cqw)}}
/* Every section flies in on its own: squashed and fast, overshoots, wobbles, settles. --d is the direction, --i the order */
@keyframes secIn{
  0%{opacity:0;transform:translateX(calc(var(--d)*-75cqw)) rotate(calc(var(--d)*-5deg)) scale(1.35,.72);animation-timing-function:cubic-bezier(.15,.75,.25,1)}
  50%{opacity:1;transform:translateX(calc(var(--d)*4cqw)) rotate(calc(var(--d)*1.5deg)) scale(.9,1.1);animation-timing-function:ease-in-out}
  72%{transform:translateX(calc(var(--d)*-1.6cqw)) scale(1.04,.97);animation-timing-function:ease-in-out}
  88%{transform:translateX(calc(var(--d)*.5cqw)) scale(.99,1.01);animation-timing-function:ease-in-out}
  100%{opacity:1;transform:none}
}
@keyframes secOut{
  0%{transform:none;animation-timing-function:ease-out}
  26%{transform:translateX(calc(var(--d)*-4.5cqw)) rotate(calc(var(--d)*-2deg)) scale(.92,1.08);animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  100%{transform:translateX(calc(var(--d)*85cqw)) rotate(calc(var(--d)*5deg)) scale(1.4,.7);opacity:0}
}
.sec{animation-name:secIn;animation-duration:.85s;animation-fill-mode:backwards;animation-delay:calc(var(--i,0)*var(--st))}
.leaving{pointer-events:none}
.leaving .sec{animation-name:secOut;animation-duration:.7s;animation-fill-mode:both;animation-delay:calc(var(--i,0)*var(--st)*.55)}
.leaving *:not(.sec):not(.shade){animation:none!important}
.leaving>.shade{animation:shOut .6s both}
.noanim .sec,.noanim .pz,.noanim .shade{animation:none!important}
.pz{animation:fade .3s both}

.bx{background:#000;border:.3cqw solid var(--phos);box-shadow:inset 0 0 0 .25cqw #000,inset 0 0 0 .4cqw #1f4d33,0 0 2.4cqw rgba(60,200,110,.18)}
.kick{padding:.7cqw 2cqw}
.kicker{font-family:"Press Start 2P",monospace;font-size:1.1cqw;letter-spacing:.7cqw;color:var(--gold)}
.logobox{padding:1cqw 3cqw 1.4cqw;margin:.9cqw 0}
.logo{font-family:"Press Start 2P",monospace;font-size:10.5cqw;line-height:1;font-weight:normal;margin:0;letter-spacing:1cqw;color:var(--red);text-shadow:.7cqw .7cqw 0 #501e19,0 0 3.5cqw rgba(217,74,58,.55);animation:glow 3.2s ease-in-out .9s infinite}
.tagbox{padding:.6cqw 2cqw;margin-bottom:1.2cqw}
.tag{font-size:2.2cqw;letter-spacing:.4cqw;color:#c8bfa5}
.menu{display:flex;flex-direction:column;align-items:center}
.menu.h{flex-direction:row;gap:1.2cqw}
.mi{position:relative;box-sizing:border-box;width:26cqw;min-width:26cqw;white-space:nowrap;font-family:"Press Start 2P",monospace;font-size:1.5cqw;padding:.8cqw 3cqw;margin:.3cqw;border:.3cqw solid var(--phos);background:#000;color:#bfe8cc;cursor:pointer;user-select:none;
  transition:transform .3s cubic-bezier(.34,1.7,.5,1),background .12s,color .12s,border-color .12s,box-shadow .12s}
.mi.sel{color:#000;background:var(--cream);border-color:var(--cream);transform:translateX(.8cqw) scale(1.05);box-shadow:0 0 2.5cqw rgba(242,232,201,.35)}
.mi.sel:before{content:"";position:absolute;left:1cqw;top:50%;margin-top:-.7cqw;border:.7cqw solid transparent;border-left:1.1cqw solid var(--red);border-right:0}
.menu.h .mi{min-width:0;font-size:1.2cqw;padding:1cqw 2.2cqw}
.menu.h .mi.sel{transform:scale(1.06)}
.menu.h .mi.sel:before{display:none}
.rec,.hint,.ver{padding:.5cqw 1.1cqw;font-size:1.8cqw;color:#9bd8b0}
.rec{left:2.5cqw;bottom:2cqw}
.sc>.hint{left:0;right:0;margin:0 auto;width:max-content;bottom:2cqw}
.title-hint{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;margin-top:1.1cqw!important}
.hint .blk{display:inline-block;animation:blink 2.2s infinite}
.ver{right:2.5cqw;bottom:2cqw;color:#6fa585}

/* online room code */
.codebig{display:inline-block;font-family:"Press Start 2P",monospace;font-size:4.2cqw;letter-spacing:.8cqw;color:var(--gold);background:#000;border:.3cqw solid var(--phos);padding:1cqw 1.6cqw 1cqw 2.4cqw;margin:.4cqw 0 1.2cqw}
.codein{font-family:"Press Start 2P",monospace;font-size:3.6cqw;letter-spacing:.8cqw;text-align:center;text-transform:uppercase;color:var(--gold);background:#000;border:.3cqw solid var(--phos);padding:1cqw;width:30cqw;margin:.4cqw 0 1.2cqw;outline:none}
.codein:focus{border-color:var(--cream)}

/* coins and the shop */
.coin{display:inline-block;width:1.5cqw;height:1.5cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#d5ad54 60%,#8a6417);border:.2cqw solid #7a5a1c;vertical-align:-.25cqw;margin-right:.6cqw}
.sc>.wallet{top:2cqw;right:2.5cqw;font-family:"Press Start 2P",monospace;font-size:1.3cqw;color:var(--gold);padding:.6cqw 1.2cqw}
.shophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9cqw}
.shophead .ph{margin:0}
.wal{font-family:"Press Start 2P",monospace;font-size:1.5cqw;color:var(--gold);background:#000;border:.25cqw solid #5a4a1c;padding:.6cqw 1.2cqw}
.tabs{display:flex;gap:.8cqw;margin-bottom:1cqw}
.tab{font-family:"Press Start 2P",monospace;font-size:1.05cqw;padding:.8cqw 1.6cqw;border:.25cqw solid #1f4d33;background:#07130d;color:#7fa890;cursor:pointer;transition:all .12s}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.on{background:var(--cream);color:#000;border-color:var(--cream)}
.sgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw;text-align:left;max-height:29.5cqw;overflow-y:auto;padding:.3cqw .6cqw .3cqw .3cqw;scrollbar-width:thin;scrollbar-color:#3f8a5c transparent}
.card{position:relative;border:.3cqw solid #1f4d33;background:#07130d;padding:.8cqw;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.7,.5,1),border-color .1s,background .1s}
.card canvas{display:block;width:100%;height:auto;aspect-ratio:240/72;background:#000}
.card.sel{border-color:var(--cream);background:#102a1c;transform:scale(1.03)}
.card.eq{border-color:var(--gold)}
.card.no{animation:nope .35s}
.cn{font-family:"Press Start 2P",monospace;font-size:1cqw;color:var(--cream);margin:.7cqw 0 .3cqw;white-space:nowrap}
.rt{font-size:.65cqw;margin-left:.7cqw;vertical-align:.1cqw}
.r0{color:#8d856f}.r1{color:#9bd8b0}.r2{color:#6fb7ff}.r3{color:#c58bff}.r4{color:#ffb36b}
.cs{font-size:1.9cqw;color:#9bd8b0;display:flex;align-items:center;line-height:1}
.card.eq .cs{color:var(--gold)}
.card.poor .cs{color:#c97a6a}
.sc.shop .mi:hover{background:var(--cream);color:#000}

.panel{width:88cqw;background:rgba(0,0,0,.96);border:.3cqw solid var(--phos);box-shadow:inset 0 0 0 .25cqw #000,inset 0 0 0 .4cqw #1f4d33,0 0 3cqw rgba(0,0,0,.8);padding:1.8cqw 2.4cqw}
.panel.narrow{width:44cqw}
.ph{font-family:"Press Start 2P",monospace;font-size:2.3cqw;font-weight:normal;color:var(--red);text-shadow:.3cqw .3cqw 0 #501e19;margin:0 0 1.2cqw;letter-spacing:.3cqw}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;text-align:left}
.gh{font-family:"Press Start 2P",monospace;font-size:.95cqw;color:var(--gold);letter-spacing:.2cqw;margin:.8cqw 0 .4cqw;border-bottom:.2cqw solid #1f4d33;padding-bottom:.5cqw}
.row{display:flex;justify-content:space-between;align-items:center;font-size:2.3cqw;padding:.25cqw 1cqw;color:#bdb59e;cursor:pointer;border-left:.4cqw solid transparent}
.row.sel{background:rgba(242,232,201,.09);border-left-color:var(--red);color:var(--cream)}
.val{display:flex;align-items:center;justify-content:space-between;gap:.8cqw;min-width:17cqw}
.val b{font-weight:normal;text-align:center;flex:1}
.ar{font-style:normal;color:var(--gold);padding:0 .8cqw;cursor:pointer;user-select:none;opacity:.35}
.row.sel .ar{opacity:1}
.row.big{width:32cqw;margin:.45cqw;padding:.8cqw 1.2cqw;border:.3cqw solid var(--phos);background:#000;color:#bfe8cc;font-size:2.2cqw;
  transition:transform .3s cubic-bezier(.34,1.7,.5,1),background .12s,color .12s,border-color .12s,box-shadow .12s}
.row.big .val{min-width:13cqw}
.row.big.sel{background:var(--cream);color:#000;border-color:var(--cream);transform:translateX(.8cqw) scale(1.05);box-shadow:0 0 2.5cqw rgba(242,232,201,.35)}
.row.big.sel .ar{color:#000}
.sdesc{height:2.6cqw;font-size:2.1cqw;color:var(--gold);text-align:center;margin-top:.9cqw}
.psub{font-size:2.2cqw;color:#c8bfa5;margin-bottom:1.4cqw;line-height:1.1}
.panel.narrow .mi{min-width:32cqw}
/* Keep the compact multiplayer dialogs inside their panel. In horizontal menus,
   the old 26cqw button width + 32cqw minimum width made the pair wider than the panel. */
.panel.narrow .menu:not(.h){width:100%;gap:.5cqw}
.panel.narrow .menu:not(.h) .mi{width:100%;min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.25;padding:.9cqw 1.2cqw}
.panel.narrow .menu.h{width:100%;gap:1cqw;flex-wrap:wrap;justify-content:center}
.panel.narrow .menu.h .mi{flex:1 1 0;width:auto;min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.25;font-size:clamp(7px,1.05cqw,13px);padding:1cqw .8cqw}
.panel.narrow .psub{max-width:100%;overflow-wrap:anywhere}
.panel.narrow .ph{overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;font-size:2cqw;border-bottom:.15cqw dotted #1f4d33;padding:.25cqw 0}
.kv b{font-weight:normal;color:var(--cream)}
.tip{font-size:1.8cqw;color:#bdb59e;margin:.4cqw 0;line-height:1.05}
.how{grid-template-columns:.8fr 1.6fr}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw 1.2cqw;max-height:36cqw;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3f8a5c transparent;padding-right:.6cqw}
.tw>div{background:rgba(31,77,51,.2);padding:.6cqw .9cqw}
.tw b{display:block;font-family:"Press Start 2P",monospace;font-weight:normal;font-size:.9cqw;color:var(--gold);margin-bottom:.35cqw}
.tw span{font-size:1.9cqw;color:#bdb59e;line-height:1}

.sc.over .bx{margin-bottom:.7cqw}
.ovt{padding:.8cqw 2.6cqw}
.ov-title{font-family:"Press Start 2P",monospace;font-size:5.8cqw;letter-spacing:.8cqw}
.win .ov-title{color:#ffd877;text-shadow:.5cqw .5cqw 0 #5a4313,0 0 4cqw rgba(255,216,119,.6)}
.lose .ov-title{color:var(--red);text-shadow:.5cqw .5cqw 0 #501e19,0 0 4cqw rgba(217,74,58,.5)}
.ovs{padding:.35cqw 1.6cqw}
.ov-sub{font-size:2.2cqw;letter-spacing:.5cqw;color:#c8bfa5}
.ovsc{padding:.7cqw 3cqw}
.ov-score{display:flex;align-items:center;gap:2.5cqw}
.nm{font-family:"Press Start 2P",monospace;font-size:1.1cqw;color:#9d957d;letter-spacing:.2cqw}
.ptog{cursor:pointer;border-bottom:.2cqw dashed #5a574a;padding:.3cqw .5cqw;transition:all .12s}
.ptog:hover{color:var(--cream);border-color:var(--gold)}
.ptog.on{color:#000;background:var(--gold);border-color:var(--gold)}
.tg{font-size:1.4cqw;color:#7fa890;margin-top:.5cqw}
.ov-score b{font-family:"Press Start 2P",monospace;font-size:5cqw;font-weight:normal}
.dash{font-size:4cqw;color:#5a574a}
.hi{color:var(--cream)}.lo{color:#6d6853}
.ov-mid{display:flex;align-items:center;gap:2.4cqw;margin:.2cqw 0 .7cqw}
.rank{width:10.5cqw;height:10.5cqw;border-width:.5cqw;border-style:solid;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}

@media(max-width:700px){.machine{padding:15px 13px}.screen-frame{padding:8px}.deck{padding:14px}.mpop{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="machine">
<header class="marquee"><h1>PONG</h1><p id="marqueeSub">PLAYER VS COMPUTER</p></header>
<section class="screen-frame"><div class="screen" id="scr">
<canvas id="game" width="960" height="540"></canvas>
<div class="ui" id="ui"></div>
<div class="ui2" id="uo"></div>
<canvas id="fx" width="960" height="540"></canvas>
<div class="toast" id="toast"></div>
<div class="scan"></div><div class="glass"></div>
</div></section>
<section class="deck">
<div class="instructions" id="instructions">P1 <b>WASD</b> MOVE &middot; <b>SPACE</b> ROTATE/SMASH &middot; <b>ESC</b> PAUSE &middot; <b>H</b> HITBOXES</div>
<div class="ctl">
<div class="pick" id="pick"><span>TWIST</span><button id="mbtn" class="dd" type="button"><b id="mtxt">CYCLE ALL</b><i class="car"></i></button><div class="mpop" id="mpop"></div></div>
<button id="pause" class="abtn"><span id="pt">PAUSE</span></button>
</div>
</section>
<section class="tweaks" id="tw">
<label data-m="bumpers">BUMPERS <input id="bn" type="range" min="1" max="8" value="4"><output id="bnv">4</output></label>
<label data-m="gravity">RADIUS <input id="gr" type="range" min="80" max="400" step="10" value="260"><output id="grv">260</output></label>
<label data-m="gravity">STRENGTH <input id="gs" type="range" min="1" max="12" value="5"><output id="gsv">5</output></label>
</section>
<div class="footer" id="foot">FIRST TO 7 &bull; EVERY ROUND HAS A NEW TWIST</div>
</main>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const cv = $("game"), ctx = cv.getContext("2d"), fx = $("fx").getContext("2d");
const W = 960, H = 540, WALL = 18, SLOWW = 200, SLOWD = .55, LANE = 64;
const TAU = Math.PI * 2;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const fract = x => x - Math.floor(x);
const rnd = (s, i) => fract(Math.sin(s * 12.9898 + i * 78.233) * 43758.5453);   // repeatable pseudo-random numbers
const r1 = n => Math.round(n * 10) / 10, r2 = n => Math.round(n * 100) / 100;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// Online play state. role is "host" (left paddle, runs the real game), "guest" (right paddle, sends its paddle and draws what the host sends) or null.
const net = { role: null, peer: null, conn: null, up: false, code: "", ev: [], oppPaddle: "classic", oppVfx: "none", pad: null, padAge: 0,
  cfg: null, snapT: 0, lastRx: 0, rem: [false, false], esc: 0, timer: 0, status: "", mk: null, pingT: 0,
  pingId: 0, pingAt: 0, rtt: 0, cl: [], tok: 0, gid: "" };
const online = () => net.role !== null;

const MODES = {
  normal: "CLASSIC PONG", gravity: "GRAVITY WELL", fast: "SUPER SPEED PADDLES",
  bumpers: "BUMPER MAYHEM", slow: "SLOW ZONE",
  spinner: "SPINNING PADDLES", speed: "TURBO COURT",
  mirror: "MIRROR CONTROLS", closing: "CLOSING WALLS", portal: "PORTALS",
  ice: "ICE PADDLES", barrier: "MOVING WALL", giant: "GIANT PADDLES",
  ghost: "GHOST BALL", heavy: "HEAVY BALL", tiny: "TINY PADDLES",
  curve: "CURVEBALL", dark: "LIGHTS OUT",
  snow: "SNOWBALL", decay: "PADDLE DECAY", pads: "BOOST PADS",
  pillars: "PILLARS", micro: "MICRO BALL",
  magnet: "MAGNET PADDLES", coins: "COIN RAIN", fever: "SMASH FEVER", lanes: "SPEED LANES",
  warm: "RALLY BOOST", flicker: "FLICKER BALL", wrap: "WRAP AROUND"
};
const INFO = {
  normal: "NO GIMMICKS. JUST PONG.", gravity: "A CENTRAL WELL BENDS THE BALL'S PATH.",
  fast: "BOTH PADDLES MOVE TWICE AS FAST.", bumpers: "BOUNCY BUMPERS SUPERCHARGE THE BALL.",
  slow: "THE BALL CRAWLS THROUGH THE MIDDLE.",
  spinner: "PADDLES SPIN NONSTOP. TIME YOUR HITS.",
  speed: "THE BALL KEEPS GETTING FASTER.", mirror: "YOUR CONTROLS ARE REVERSED.",
  closing: "THE WALLS CLOSE IN OVER TIME.", portal: "TWO PORTALS TELEPORT THE BALL.",
  ice: "SLIPPERY PADDLES. PLAN AHEAD.", barrier: "A MOVING WALL BLOCKS THE MIDDLE.",
  giant: "ENORMOUS PADDLES.", ghost: "THE BALL VANISHES IN THE MIDDLE.",
  heavy: "A BIG, SLOW, HEAVY BALL.", tiny: "TINY PADDLES. PRECISION ONLY.",
  curve: "THE BALL CURVES THROUGH THE AIR.", dark: "LIGHTS OUT. FOLLOW THE GLOW.",
  snow: "THE BALL GROWS A LITTLE WITH EVERY HIT.", decay: "PADDLES SHRINK FAST WITH EVERY HIT.",
  pads: "BOOST PADS SEND THE BALL FLYING.", pillars: "SOLID PILLARS BLOCK THE MIDDLE.",
  micro: "A TINY BALL. KEEP YOUR EYES ON IT.",
  magnet: "PADDLES PULL THE BALL TOWARD THEM AS IT APPROACHES.",
  coins: "COINS FLOAT IN THE MIDDLE. HIT THEM WITH THE BALL FOR BONUS CASH.",
  fever: "SMASH CHARGES IN JUST 2 HITS INSTEAD OF 4.",
  lanes: "THE TOP AND BOTTOM LANES SPEED THE BALL UP.",
  warm: "EVERY HIT MAKES THE BALL FASTER, UP TO A POINT.",
  flicker: "THE BALL BLINKS IN AND OUT OF SIGHT.",
  wrap: "NO TOP OR BOTTOM WALLS. THE BALL WRAPS AROUND."
};
const ORDER = Object.keys(MODES);
const TWISTS = ORDER.filter(k => k !== "normal");

// Modes that can't be played together (they fight over the same thing: paddle size, ball size, the middle of the court...)
const CLASH_PAIRS = [["tiny", "giant"], ["heavy", "micro"], ["heavy", "snow"], ["micro", "snow"], ["ghost", "dark"],
  ["bumpers", "pillars"], ["bumpers", "barrier"], ["bumpers", "portal"], ["bumpers", "pads"], ["pillars", "barrier"],
  ["portal", "pads"], ["flicker", "ghost"], ["flicker", "dark"], ["wrap", "closing"], ["lanes", "closing"], ["fever", "spinner"]];
const clash = (a, b) => CLASH_PAIRS.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
const clashWith = (k, list) => list.filter(m => clash(m, k));

// The modes active this round (more than one can be active at once)
let mods = new Set();
const has = k => mods.has(k);
const modeLabel = () => mods.size ? [...mods].map(k => MODES[k]).join(" + ") : MODES.normal;
const modeInfo = () => mods.size ? [...mods].map(k => INFO[k]) : [INFO.normal];

// CYCLE picks from a shuffled bag so every twist shows up before any repeats
let bag = [], lastCycle = "";
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function nextCycle() {
  if (!bag.length) { bag = shuffle(ORDER.slice()); if (bag.length > 1 && bag[bag.length - 1] === lastCycle) bag.unshift(bag.pop()); }
  lastCycle = bag.pop(); return lastCycle;
}
function randomCombo() {                       // MIX: 2 or 3 random modes that get along
  const pool = shuffle(TWISTS.slice()), out = [], want = Math.random() < .45 ? 3 : 2;
  for (const k of pool) { if (!out.some(o => clash(o, k))) out.push(k); if (out.length >= want) break; }
  return out;
}

const pauseBtn = $("pause"), ui = $("ui"), uo = $("uo");
const diff = { value: "normal" };            // current difficulty (set from the menus)

/* ---------- twist picker: pick several modes, or let the game cycle or mix them ---------- */
const pick = $("pick"), mbtn = $("mbtn"), mtxt = $("mtxt"), mpop = $("mpop");
let popDirty = false;
const SRC = [["cycle", "CYCLE ALL", "A NEW RANDOM TWIST EVERY ROUND."], ["mix", "MIX IT UP", "RANDOM COMBOS OF 2 OR 3 MODES EVERY ROUND."], ["normal", "CLASSIC ONLY", "CLEAR YOUR PICKS AND PLAY PLAIN PONG."]];
mpop.innerHTML = [...SRC, ...TWISTS.map(k => [k, MODES[k], INFO[k]])]
  .map(([k, n, d]) => `<div class="opt" data-v="${k}" data-d="${d}" role="option"><b>${n}</b><span>${d}</span></div>`).join("");
const popOpts = () => [...mpop.querySelectorAll(".opt")];
function modeBtnLabel() {
  if (S.mode === "cycle") return "CYCLE ALL";
  if (S.mode === "mix") return "MIX IT UP";
  if (!S.mods.length) return "CLASSIC";
  return S.mods.length === 1 ? MODES[S.mods[0]] : MODES[S.mods[0]] + " +" + (S.mods.length - 1);
}
function markPop() {
  popOpts().forEach(o => {
    const v = o.dataset.v; let on = false, cl = [];
    if (v === "cycle" || v === "mix") on = S.mode === v;
    else if (v === "normal") on = S.mode === "pick" && !S.mods.length;
    else { on = S.mode === "pick" && S.mods.includes(v); if (S.mode === "pick" && !on) cl = clashWith(v, S.mods); }
    o.classList.toggle("on", on); o.classList.toggle("clash", cl.length > 0);
    o.querySelector("span").textContent = cl.length ? "SWAPS OUT " + cl.map(k => MODES[k]).join(" + ") : o.dataset.d;
  });
  mtxt.textContent = modeBtnLabel();
}
// The list is fixed to the window: centered on the game screen and always kept fully on-screen.
function placePop() {
  const r = mbtn.getBoundingClientRect(), f = $("scr").getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
  const w = Math.min(620, vw - 20);
  mpop.style.width = w + "px";
  mpop.style.left = clamp(f.left + f.width / 2 - w / 2, 10, vw - w - 10) + "px";
  const h = Math.min(mpop.scrollHeight + 6, 340), up = r.top - 14, dn = vh - r.bottom - 14;
  if (up >= h || (dn < h && up >= dn)) {          // open upward
    mpop.style.top = "auto"; mpop.style.bottom = (vh - r.top + 12) + "px"; mpop.style.maxHeight = Math.min(340, up) + "px";
  } else {                                        // open downward
    mpop.style.bottom = "auto"; mpop.style.top = (r.bottom + 12) + "px"; mpop.style.maxHeight = Math.min(340, dn) + "px";
  }
}
function openPop() {
  if (online()) { showToast("TWISTS ARE CHOSEN BY THE HOST IN ONLINE MATCHES"); return; }
  if (screen === "playing") showScreen("pause");
  pick.classList.add("open"); mpop.classList.add("open");
  placePop();
  popOpts().forEach(o => o.classList.remove("hov"));
  const c = mpop.querySelector(".on");
  if (c) mpop.scrollTop = c.offsetTop - mpop.clientHeight / 2 + c.offsetHeight / 2;
}
function closePop() {
  const was = mpop.classList.contains("open");
  pick.classList.remove("open"); mpop.classList.remove("open");
  if (was && popDirty && screen === "pause") { popDirty = false; startMatch(); }   // picks apply from a fresh match
  popDirty = false;
}
// Clicking a mode toggles it. If it clashes with modes you already picked, those get swapped out.
function pickMode(v) {
  if (v === "cycle" || v === "mix") S.mode = v;
  else if (v === "normal") { S.mode = "pick"; S.mods = []; }
  else {
    S.mode = "pick";
    if (S.mods.includes(v)) S.mods = S.mods.filter(m => m !== v);
    else S.mods = S.mods.filter(m => !clash(m, v)).concat(v);
  }
  popDirty = true; save(); markPop(); sfx("select");
}
mbtn.addEventListener("click", e => {
  e.stopPropagation(); mbtn.blur();
  mpop.classList.contains("open") ? closePop() : openPop();
});
mpop.addEventListener("click", e => { const o = e.target.closest(".opt"); if (o) pickMode(o.dataset.v); });
document.addEventListener("click", e => { if (!e.target.closest("#pick")) closePop(); });
window.addEventListener("resize", () => { if (mpop.classList.contains("open")) placePop(); });
window.addEventListener("scroll", () => { if (mpop.classList.contains("open")) placePop(); }, true);
function popKey(e, k) {
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "enter", " ", "escape"].includes(k)) e.preventDefault();
  const o = popOpts();
  let i = o.findIndex(x => x.classList.contains("hov"));
  if (i < 0) i = 0;
  if (k === "escape") { closePop(); return; }
  if (k === "enter" || k === " ") { pickMode(o[i].dataset.v); o.forEach((x, j) => x.classList.toggle("hov", j === i)); return; }
  const cols = getComputedStyle(mpop).gridTemplateColumns.split(" ").length;
  if (k === "arrowright" || k === "d") i = (i + 1) % o.length;
  else if (k === "arrowleft" || k === "a") i = (i - 1 + o.length) % o.length;
  else if (k === "arrowdown" || k === "s") i = Math.min(i + cols, o.length - 1);
  else if (k === "arrowup" || k === "w") i = Math.max(i - cols, 0);
  o.forEach((x, j) => x.classList.toggle("hov", j === i));
  const t = o[i];
  if (t.offsetTop < mpop.scrollTop) mpop.scrollTop = t.offsetTop - 8;
  else if (t.offsetTop + t.offsetHeight > mpop.scrollTop + mpop.clientHeight) mpop.scrollTop = t.offsetTop + t.offsetHeight - mpop.clientHeight + 8;
  sfx("move");
}

/* ---------- settings ---------- */
const DEFV = { players: "cpu", diff: "normal", win: 7, mode: "cycle", mods: [], ball: 1, psize: 1, pspeed: 1, rotate: true,
  bumpers: 4, gravR: 260, gravS: 5, vol: .7, crt: true, shake: true, slowmo: true, anim: true };
const S = { ...DEFV, mods: [] };
const nums = a => a.map(n => ["" + n, n]);
const ONOFF = [["ON", true], ["OFF", false]];
const SETTINGS = [
  ["players", "GAMEPLAY", "MATCH TYPE", "PLAY AGAINST THE CPU OR CHALLENGE A SECOND PLAYER ON THE SAME KEYBOARD.", [["VS COMPUTER", "cpu"], ["LOCAL 2 PLAYER", "local"]]],
  ["diff", "GAMEPLAY", "DIFFICULTY", "HOW SKILLED THE CPU OPPONENT IS. HIDDEN IN LOCAL 2 PLAYER.", [["EASY", "easy"], ["NORMAL", "normal"], ["HARD", "hard"]]],
  ["win", "GAMEPLAY", "POINTS TO WIN", "POINTS NEEDED TO WIN A MATCH.", nums([3, 5, 7, 10, 15, 21])],
  ["mode", "GAMEPLAY", "TWIST MODE", "CYCLE: A NEW TWIST EACH ROUND. MIX: RANDOM COMBOS. PICK OWN: USE THE TWIST BUTTON UNDER THE SCREEN.", [["CYCLE ALL", "cycle"], ["MIX IT UP", "mix"], ["PICK OWN", "pick"]]],
  ["ball", "GAMEPLAY", "BALL SPEED", "HOW FAST THE BALL TRAVELS.", [["SLOW", .75], ["NORMAL", 1], ["FAST", 1.3], ["INSANE", 1.7]]],
  ["psize", "GAMEPLAY", "PADDLE SIZE", "LENGTH OF BOTH PADDLES (APPLIES NEXT ROUND).", [["SMALL", .7], ["NORMAL", 1], ["LARGE", 1.4]]],
  ["pspeed", "GAMEPLAY", "YOUR SPEED", "HOW FAST YOUR PADDLE MOVES.", [["SLOW", .75], ["NORMAL", 1], ["FAST", 1.3]]],
  ["rotate", "GAMEPLAY", "ROTATION", "ALLOW PADDLE ROTATION (AND SMASHES) FOR YOU AND THE CPU.", ONOFF],
  ["bumpers", "TWIST TUNING", "BUMPER COUNT", "BUMPER MAYHEM: HOW MANY BUMPERS ARE ON THE COURT.", nums([1, 2, 3, 4, 5, 6, 7, 8])],
  ["gravR", "TWIST TUNING", "GRAVITY RADIUS", "GRAVITY WELL: HOW FAR THE PULL REACHES.", nums([100, 140, 180, 220, 260, 300, 340, 380])],
  ["gravS", "TWIST TUNING", "GRAVITY POWER", "GRAVITY WELL: HOW HARD THE BALL IS BENT.", nums([1, 2, 3, 4, 5, 6, 8, 10, 12])],
  ["vol", "AUDIO & VIDEO", "SOUND", "SOUND EFFECTS VOLUME.", [["OFF", 0], ["LOW", .35], ["MEDIUM", .7], ["HIGH", 1]]],
  ["crt", "AUDIO & VIDEO", "CRT EFFECT", "SCANLINES AND SCREEN GLASS.", ONOFF],
  ["shake", "AUDIO & VIDEO", "SCREEN SHAKE", "THE SCREEN SHAKES WHEN SOMEONE SCORES OR SMASHES.", ONOFF],
  ["slowmo", "AUDIO & VIDEO", "SMASH SLOW-MO", "A BRIEF SLOW MOTION MOMENT WHEN A SMASH LANDS.", ONOFF],
  ["anim", "AUDIO & VIDEO", "ANIMATIONS", "BOUNCY MENUS, SQUASH & STRETCH ON THE BALL AND PADDLES, AND SCORE POPS.", ONOFF]
].map(([id, grp, label, tip, opts]) => ({ id, grp, label, tip, opts }));

const HOOK = {   // extra work to do when a setting changes
  players: v => { updatePlayerModeUI(); updateSettingsVisibility(); },
  diff: v => diff.value = v,
  mode: v => markPop(),
  win: v => updatePlayerModeUI(),
  crt: v => $("scr").classList.toggle("nocrt", !v),
  bumpers: v => { $("bn").value = v; $("bnv").textContent = v; },
  gravR: v => { $("gr").value = v; $("grv").textContent = v; },
  gravS: v => { $("gs").value = v; $("gsv").textContent = v; }
};
const setS = (id, v) => { S[id] = v; if (HOOK[id]) HOOK[id](v); };
const save = () => store.set("pong_cfg", S);

[["bn", "bnv", "bumpers"], ["gr", "grv", "gravR"], ["gs", "gsv", "gravS"]].forEach(([i, o, key]) => {
  const el = $(i);
  el.oninput = () => { S[key] = +el.value; $(o).textContent = el.value; save(); };
  el.onchange = () => el.blur();
});

const sv = store.get("pong_cfg") || {};
SETTINGS.forEach(s => {
  const v = sv[s.id];
  if (v !== undefined && typeof v === typeof DEFV[s.id] && (typeof v !== "string" || s.opts.some(o => o[1] === v))) S[s.id] = v;
});
// Saved picks of modes that no longer exist are dropped here
if (Array.isArray(sv.mods)) { const m = []; sv.mods.forEach(k => { if (MODES[k] && k !== "normal" && !m.some(o => clash(o, k))) m.push(k); }); S.mods = m; }
SETTINGS.forEach(s => setS(s.id, S[s.id]));
updatePlayerModeUI();

const rec = Object.assign({ w: 0, l: 0, streak: 0, best: 0, rally: 0, games: 0 }, store.get("pong_rec") || {});

/* ---------- sound ---------- */
let ac = null, lastBeep = 0;
function beep(f, d = .06, type = "square", v = 1, slide = 0) {
  if (!S.vol) return;
  const now = performance.now();
  if (now - lastBeep < 12) return;
  lastBeep = now;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.value = .08 * S.vol * v;
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}
const seq = (notes, step, type, d) => notes.forEach((f, i) => setTimeout(() => beep(f, d, type), i * step));
const SFX = {
  hit: () => beep(460 + Math.random() * 70, .06), wall: () => beep(250, .05, "square", .7),
  bump: () => beep(720, .09, "triangle", 1, -300), brick: () => beep(330, .08, "sawtooth", .8, -120),
  portal: () => beep(900, .12, "sine", .9, -600), move: () => beep(520, .03, "square", .5),
  tick: () => beep(700, .04, "square", .6), select: () => seq([660, 880], 60, "square", .08),
  score: () => seq([520, 780], 100, "square", .12), lose: () => seq([300, 200], 120, "sawtooth", .16),
  win: () => seq([523, 659, 784, 1047], 130, "square", .2), defeat: () => seq([392, 330, 262, 196], 170, "sawtooth", .24),
  ready: () => seq([880, 1320], 70, "square", .1),
  coin: () => seq([988, 1319], 70, "square", .1), deny: () => beep(170, .16, "sawtooth", .9, -60),
  smash: () => { beep(110, .3, "sawtooth", 1.6, -60); setTimeout(() => beep(1100, .18, "square", 1, -900), 25); setTimeout(() => beep(300, .22, "triangle", 1, -200), 80); }
};
// In an online match the host also tells the guest which game sounds to play
const NETSFX = new Set(["hit", "wall", "bump", "brick", "portal"]);
const sfx = n => { if (SFX[n]) SFX[n](); if (net.role === "host" && net.up && NETSFX.has(n)) net.ev.push(["s", n]); };

/* ---------- shop: coins, paddle and ball skins, court themes, hit effects ---------- */
const rect = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
const disc = (c, r) => { c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); };
const tri = (c, x1, y1, x2, y2, x3, y3) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); c.fill(); };
const poly = (c, n, r) => { c.beginPath(); for (let i = 0; i < n; i++) { const a = i * TAU / n - Math.PI / 2; i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); };

// Works out rank and the end screen. mine / opp are the scores from the point of view of whoever is looking at this screen.
function finishMatch(mine, opp, adj) {
  const win = mine > opp, t = cf().win, L = ["D", "C", "B", "A", "S"];
  let r = win ? (opp === 0 ? 4 : opp <= t * .4 ? 3 : 2) : (mine >= t * .6 ? 1 : 0);
  if (win && adj) r = clamp(r + (S.diff === "hard" ? 1 : S.diff === "easy" ? -1 : 0), 2, 4);
  const newRally = M.longest > rec.rally;
  rec.games++; rec.rally = Math.max(rec.rally, M.longest);
  if (win) { rec.w++; rec.streak++; rec.best = Math.max(rec.best, rec.streak); } else { rec.l++; rec.streak = 0; }
  store.set("pong_rec", rec); saveShop();
  const sub = win ? (opp === 0 ? "FLAWLESS VICTORY" : opp >= t - 1 ? "NAIL-BITING FINISH" : "WELL PLAYED")
                  : (mine >= t - 1 ? "SO CLOSE!" : "BETTER LUCK NEXT TIME");
  res = { win, rank: L[r], sub, newRally };
  sfx(win ? "win" : "defeat");
  showScreen("over", { fresh: true });
}
function endMatch() {
  if (net.role === "host" && net.up) send({ t: "end", sc: [scoreP, scoreC], ev: net.ev.splice(0),
    st: { lg: M.longest, top: r1(M.top), time: r1(M.time), hist: M.hist, p: M.p } });
  finishMatch(scoreP, scoreC, !twoP());
}

// The six boxes on the end screen. With two human players you can click P1 or P2 to see that player's own numbers.
function statItems(view) {
  const P = M.p, tot = P[0].hits + P[1].hits || 1;
  if (!twoP()) return [["LONGEST RALLY", M.longest], ["YOUR HITS", P[0].hits], ["TOP SPEED PX/S", Math.round(M.top)], ["MATCH TIME", null, "", fmtTime(M.time)], ["DIFFICULTY", null, "", S.diff.toUpperCase()], ["SMASHES", P[0].sm]];
  if (view === 0) return [["LONGEST RALLY", M.longest], ["P1 HITS", P[0].hits], ["P2 HITS", P[1].hits], ["MATCH TIME", null, "", fmtTime(M.time)], ["MATCH TYPE", null, "", online() ? "ONLINE 2P" : "LOCAL 2P"], ["SMASHES", P[0].sm + P[1].sm]];
  const q = P[view - 1];
  return [["POINTS WON", q.pts], ["HITS", q.hits], ["SMASHES", q.sm], ["TOP HIT SPEED", Math.round(q.top)], ["HIT SHARE", Math.round(100 * q.hits / tot), "%"], ["LONGEST RALLY", M.longest]];

function statsHtml(view, sec, zero) {

}
function runCounters(root, delay, dur) {

    const to = +el.dataset.to, suf = el.dataset.suf || "", t0 = performance.now() + delay;
    (function f(t) { const k = clamp((t - t0) / dur, 0, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf; if (k < 1 && el.isConnected) requestAnimationFrame(f); })(performance.now());
  });
}

function act(a) {

  if (a === "local") { setS("players", "local"); save(); startMatch(); }
  else if (a === "play") { setS("players", "cpu"); save(); startMatch(); }
  else if (a === "rematch") { if (online()) netRematch(); else startMatch(); }
  else if (a === "restart") startMatch();
  else if (a === "shop") { shopFrom = screen; showScreen("shop"); }
  else if (a === "shopback") showScreen(shopFrom);
  else if (a === "settings") { settingsFrom = screen; showScreen("settings"); }
  else if (a === "howto") showScreen("howto");
  else if (a === "multi") showScreen("multi");
  else if (a === "multiback") showScreen("title");
  else if (a === "online") showScreen("lobby");
  else if (a === "hostgame") { startHost(); showScreen("host"); }
  else if (a === "joingame") { leaveNet(); net.status = ""; net.code = ""; showScreen("join"); }
  else if (a === "connect") startJoin(($("codeIn") || {}).value);
  else if (a === "copycode") copyCode();
  else if (a === "lobbyback") { leaveNet(); showScreen("lobby"); }
  else if (a === "netquit") showScreen("multi");

  else if (a === "back") showScreen(settingsFrom);

  }
}

function menuKey(e, k) {
  if (screen === "shop") { shopKey(e, k); return; }
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter", "escape"].includes(k)) e.preventDefault();
  if (k === "escape") {
    if (screen === "pause") act("resume"); else if (screen === "settings") act("back");
    else if (screen === "howto") act("howback"); else if (screen === "over") act("menu");
    else if (screen === "multi") act("multiback"); else if (screen === "lobby") act("netquit");
    else if (screen === "host" || screen === "join") act("lobbyback");
    return;
  }
  if (screen === "howto") {
    const tw = ui.querySelector(".tw");
    if (tw && (k === "arrowdown" || k === "s")) tw.scrollTop += 60;
    if (tw && (k === "arrowup" || k === "w")) tw.scrollTop -= 60;
    if (k === "enter" || k === " ") act("howback");
    return;
  }
  const cur = items()[selI], isRow = cur && cur.classList.contains("row"), horiz = cur && cur.closest(".h");
  if (k === "arrowup" || k === "w") sel(selI - 1);
  else if (k === "arrowdown" || k === "s") sel(selI + 1);
  else if (k === "arrowleft" || k === "a") { if (isRow) change(cur, -1); else if (horiz) sel(selI - 1); }
  else if (k === "arrowright" || k === "d") { if (isRow) change(cur, 1); else if (horiz) sel(selI + 1); }
  else if (k === "enter" || k === " ") { if (isRow) change(cur, 1); else if (cur) act(cur.dataset.act); }
}

// Pausing: solo and local games pause. Online matches can't, so ESC twice leaves instead.
function pauseGame(fromEsc) {
  if (!online()) { showScreen("pause"); return; }
  if (!fromEsc) { showToast("ONLINE MATCHES CAN'T BE PAUSED"); return; }
  const now = performance.now();
  if (now - net.esc < 2000) leaveMatch(); else { net.esc = now; showToast("PRESS ESC AGAIN TO LEAVE THE MATCH"); }
}

const mine = () => net.role === "guest" ? cpu : player;     // the paddle this computer controls

window.onkeydown = e => {
  const k = e.key.toLowerCase();
  if (e.target.id === "codeIn") {                            // typing a room code
    if (k === "enter") { e.preventDefault(); act("connect"); }
    else if (k === "escape") { e.preventDefault(); e.target.blur(); act("lobbyback"); }
    return;
  }
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") e.target.blur();
  if (mpop.classList.contains("open")) { popKey(e, k); return; }
  if (screen !== "playing") { menuKey(e, k); return; }
  if (k === "escape" || k === "p") { e.preventDefault(); pauseGame(k === "escape"); return; }
  keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === " " && !e.repeat) rotate(mine());
  // Local P2 gets a dedicated rotate/smash control (both Enter keys work). Online players can use it too.
  const p2RotateKey = e.code === "Enter" || e.code === "NumpadEnter";
  if (p2RotateKey && !e.repeat) {
    if (online()) { e.preventDefault(); rotate(mine()); }
    else if (localMode()) { e.preventDefault(); rotate(cpu); }
  }
  if (k === "r" && !online()) startMatch();
  if (k === "h") debug = !debug;
};

/* ---------- paddles ---------- */
function rotate(p) {
  if (has("spinner") || !cf().rotate) return;
  const dir = p === cpu && localMode() && !online() ? -1 : 1;     // local player 2 spins the opposite way (counter-clockwise)
  if (p.rot) { p.from = p.angle; p.to += dir * Math.PI / 2; }      // already turning: keep going
  else { p.from = p.angle; p.to = p.angle + dir * Math.PI / 2; p.rot = true; }
  p.t = 0; p.dur = .22;
}

function tickT(p, dt) {                                 // the little cooldown timers every paddle has
  p.power = Math.max(0, p.power - dt);
  p.cool = Math.max(0, p.cool - dt);
  p.rotCool = Math.max(0, p.rotCool - dt);
  p.sk = Math.max(0, p.sk - dt);
}
function spin(p, dt) {
  tickT(p, dt);
  const old = p.angle;
  if (has("spinner")) p.angle += (p === player ? 1 : -1) * 2.4 * dt;
  else if (p.rot) {
    p.t += dt;
    const t = clamp(p.t / p.dur, 0, 1), e = 1 - Math.pow(1 - t, 3);
    p.angle = p.from + (p.to - p.from) * e;
    if (t >= 1) { p.angle = p.to; p.rot = false; p.power = .1; }
  }
  p.omega = (p.angle - old) / dt;
}

/* Paddle squash & stretch: the paddle is a spring. The faster it spins, the longer and thinner it gets;
   when the spin slows it snaps back with a small overshoot. The hitbox uses the same stretched size. */
function flex(p, dt) {
  if (!S.anim) { p.s = p.sv = 0; p.dx = p.dy = 1; p.ik = 0; p.gh.length = 0; p.smearT = 0; return; }
  const target = clamp(Math.abs(p.omega) * .012, 0, .26);
  const n = 3, h = dt / n;
  for (let i = 0; i < n; i++) {
    p.sv += (420 * (target - p.s) - 15 * p.sv) * h;
    p.s += p.sv * h;
  }
  p.s = clamp(p.s, -.2, .34);
  const sy = Math.min(1.2, 1 + p.s * .9);
  p.dy = sy; p.dx = 1 / Math.pow(sy, 1.4);               // longer = thinner, shorter = thicker
  p.ik = Math.max(0, p.ik - dt * 5.5);                    // impact flex fades quickly
  p.smearT = Math.max(0, p.smearT - dt);
  if (p.smearT > 0 && Math.abs(p.omega) > 5) p.gh.push({ x: p.x, y: p.y, a: p.angle, dx: p.dx, dy: p.dy, l: 1 });   // smear is reserved for smash attacks
  p.gh.forEach(g => g.l -= dt * 7);
  p.gh = p.gh.filter(g => g.l > 0).slice(-6);
}

function clampPaddle(p, side) {
  const w = PW(p), h = PH(p), c = Math.cos(p.angle), s = Math.sin(p.angle);
  const ex = (w / 2) * Math.abs(c) + (h / 2) * Math.abs(s);
  const ey = (w / 2) * Math.abs(s) + (h / 2) * Math.abs(c);
  p.x = side === 0 ? clamp(p.x, WALL + ex, W / 2 - WALL - ex)
                   : clamp(p.x, W / 2 + WALL + ex, W - WALL - ex);
  p.y = clamp(p.y, wy + ey, H - wy - ey);
}

// Keyboard input. In local 2 player, P1 is WASD-only so the arrow keys belong to P2. Everywhere else you get WASD and the arrows.
function inputP1() {
  const local = localMode() && !online();
  const dx = local ? ((keys.d ? 1 : 0) - (keys.a ? 1 : 0)) : ((keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0));
  const dy = local ? ((keys.s ? 1 : 0) - (keys.w ? 1 : 0)) : ((keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0));
  return [dx, dy];
}
const inputP2 = () => [(keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0), (keys.arrowdown ? 1 : 0) - (keys.arrowup ? 1 : 0)];

// Moves a human-controlled paddle (handles mirror controls, ice, walls and the speed the ball picks up from the paddle)
function moveHuman(p, side, dt, inp) {
  let dx = inp[0], dy = inp[1];
  if (has("mirror")) { dx = -dx; dy = -dy; }
  const l = Math.hypot(dx, dy) || 1, sp = 480 * spdMul() * cf().pspeed, ox = p.x, oy = p.y;
  let tx = dx / l * sp, ty = dy / l * sp;
  if (has("ice")) {
    const k = Math.min(1, dt * 2.2);
    p.mvx += (tx - p.mvx) * k; p.mvy += (ty - p.mvy) * k;
    tx = p.mvx; ty = p.mvy;
  }
  p.x += tx * dt; p.y += ty * dt;
  clampPaddle(p, side);
  p.vx = (p.x - ox) / dt; p.vy = (p.y - oy) / dt;
  if (has("ice")) { p.mvx = p.vx; p.mvy = p.vy; }
}

function moveCpu(dt) {
  const L = LV(), sp = L.speed * spdMul(), ox = cpu.x, oy = cpu.y;
  let vx = clamp((cpuX - cpu.x) * L.gain, -sp, sp);
  let vy = clamp((cpuY - cpu.y) * L.gain, -sp, sp);
  if (has("ice")) {
    const k = Math.min(1, dt * 2.5);
    cpu.mvx += (vx - cpu.mvx) * k; cpu.mvy += (vy - cpu.mvy) * k;
    vx = cpu.mvx; vy = cpu.mvy;
  }
  cpu.x += vx * dt; cpu.y += vy * dt;
  clampPaddle(cpu, 1);
  cpu.vx = (cpu.x - ox) / dt; cpu.vy = (cpu.y - oy) / dt;
  if (has("ice")) { cpu.mvx = cpu.vx; cpu.mvy = cpu.vy; }
}

// The bot. Normal predicts wall bounces; Hard replays the real physics, aims shots away from you,
// and times its smash to the instant of contact.
function think() {
  if (twoP()) return;
  const L = LV();
  let b = balls[0];
  balls.forEach(o => { if (o.vx > 0 && (b.vx <= 0 || o.x > b.x)) b = o; });
  const incoming = b.vx > 0;
  if (incoming && !sawIncoming) {
    cpuErr = (Math.random() - .5) * 2 * L.err;
    cpuPower = L.predict === 2 && Math.random() < .35;
  }
  sawIncoming = incoming;
  const tc = incoming ? (cpu.x - cpu.w / 2 - b.r - b.x) / b.vx : 99;      // seconds until the ball reaches the paddle
  if (incoming) {
    const tx = HOME - L.reach * .85 - 12;
    const py = L.predict === 2 ? simArrival(b, tx) : L.predict === 1 ? predictY(b, tx) : b.y;
    const aim = clamp((player.y - H / 2) / (H / 2), -1, 1) * L.aim * (cpu.h / 2);   // hit off-centre to send the ball away from you
    cpuY = py - aim + cpuErr;
    cpuX = HOME - L.reach * clamp((b.x - W * .45) / (W * .3), 0, 1);
  } else {
    if (L.recenter) cpuY = H / 2;
    cpuX = HOME;
  }
  if (has("spinner")) return;
  if (L.smash && smashOn() && cpu.charge >= smashNeed() && incoming && !cpu.rot && tc > 0 && tc < .09 && Math.abs(b.y - cpu.y) < cpu.h * .5) {
    rotate(cpu); rotate(cpu); return;           // fully charged: spin a full 180 so the swing is at full speed on contact
  }
  if (L.predict === 2) {
    if (cpuPower && incoming && !cpu.rot && tc > .05 && tc < .1 && Math.abs(b.y - cpu.y) < cpu.h * .4) { rotate(cpu); rotate(cpu); cpuPower = false; }
    return;
  }
  if (cpu.rot || cpu.rotCool > 0) return;
  const sideways = Math.round(cpu.angle / (Math.PI / 2)) % 2 !== 0;
  if (incoming && !sideways && b.x > W * .62 && Math.abs(b.y - cpu.y) > cpu.h * .3 && Math.random() < L.rot) {
    rotate(cpu); cpu.rotCool = .9;
  } else if (!incoming && sideways) { rotate(cpu); cpu.rotCool = .9; }
}

/* ---------- smash and hit effects ---------- */
function smashFx(b) {
  sfx("smash");
  if (cf().slowmo) slowT = SLOWD;
  flashT = .16; shakeT = .45;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * 6.283, s = 120 + Math.random() * 420, l = .5 + Math.random() * .4;
    sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l, m: l });
  }
  rings.push({ x: b.x, y: b.y, t: 0 });
  pops.push({ x: clamp(b.x, 90, W - 90), y: b.y - 28, t: 0 });
  if (net.role === "host" && net.up) net.ev.push(["sm", r1(b.x), r1(b.y)]);
}
function coinBurst(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * TAU, s = 70 + Math.random() * 180, l = .35 + Math.random() * .3;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l, m: l, col: i % 2 ? "#ffd23f" : "#f2e8c9" });
  }
  if (net.role === "host" && net.up) net.ev.push(["cb", r1(x), r1(y)]);
}
// Hit effects: in online matches each paddle uses the effect its own player has equipped
function vfxIdFor(pi) {
  if (!online()) return shop.eq.vfx;
  const mineSide = (pi === 0) === (net.role !== "guest");
  const id = mineSide ? shop.eq.vfx : net.oppVfx;
  return own(VFX, id) ? id : "none";
}
function pushVfx(id, x, y, ang, pow) {
  vfxList.push({ k: id, x, y, t: 0, seed: Math.random() * 1000, pow, ang });
  if (vfxList.length > 24) vfxList.shift();
}
function spawnVfx(b, h, pow, pi) {
  const ang = Math.atan2(h.ny, h.nx), id = vfxIdFor(pi);
  if (id !== "none") pushVfx(id, b.x, b.y, ang, pow);
  if (net.role === "host" && net.up) net.ev.push(["h", pi, r1(b.x), r1(b.y), r2(ang), pow]);
}
function fxUpdate(dt) {
  sparks = sparks.filter(s => (s.l -= dt) > 0);
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 1 - 3 * dt; s.vy *= 1 - 3 * dt; });
  rings = rings.filter(r => (r.t += dt * 2) < 1);
  pops = pops.filter(p => (p.t += dt * 1.1) < 1);
  coinPops = coinPops.filter(p => (p.t += dt * 1.2) < 1);
  vfxList = vfxList.filter(v => (v.t += dt / .6) < 1);
}

// Ball squash & stretch: remember where and how hard the ball was hit; drawBall() turns that into a quick wobble.
function squashBall(b, nx, ny, amt) { b.sa = Math.atan2(ny, nx); b.sm = amt; b.ht = 0; }

/* ---------- collisions ---------- */
function hitRect(b, p) {
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  const rx = b.x - p.x, ry = b.y - p.y;
  const lx = rx * c + ry * s, ly = -rx * s + ry * c;
  const hw = p.w * (p.dx || 1) / 2, hh = p.h * (p.dy || 1) / 2;
  const dx = lx - clamp(lx, -hw, hw), dy = ly - clamp(ly, -hh, hh);
  const d = Math.hypot(dx, dy);
  if (d >= b.r) return null;
  let nx, ny, pen;
  if (d > 1e-6) { nx = dx / d; ny = dy / d; pen = b.r - d; }
  else {
    const gx = hw - Math.abs(lx), gy = hh - Math.abs(ly);
    if (gx < gy) { nx = Math.sign(lx) || 1; ny = 0; pen = gx + b.r; }
    else { nx = 0; ny = Math.sign(ly) || 1; pen = gy + b.r; }
  }
  return { nx: nx * c - ny * s, ny: nx * s + ny * c, pen, ly };
}

function bounce(b, p, isPaddle) {
  const h = hitRect(b, p);
  if (!h) return false;
  b.x += h.nx * (h.pen + .5); b.y += h.ny * (h.pen + .5);
  const rx = b.x - p.x, ry = b.y - p.y;
  const sx = p.vx - p.omega * ry, sy = p.vy + p.omega * rx;
  const vn = (b.vx - sx) * h.nx + (b.vy - sy) * h.ny;
  if (vn >= 0) return true;
  b.vx -= 2 * vn * h.nx; b.vy -= 2 * vn * h.ny;
  if (!isPaddle) { squashBall(b, h.nx, h.ny, .8); return true; }
  sfx("hit");
  const pi = p === player ? 0 : 1;
  M.rally++; M.longest = Math.max(M.longest, M.rally);
  comboT = 1.15; comboPop = .42;
  // Rally money: +1 coin for every hit from the third on, and a bonus on every 5th hit
  if (M.rally >= 3) { const big = M.rally % 5 === 0; addCoins(1 + (big ? M.rally : 0), b.x, b.y, big); }
  if (has("snow")) b.r = Math.min(30, b.r + 1.6);
  if (has("decay")) { p.h = Math.max(34, p.h - 9); p.sk = .35; }      // paddles visibly shrink with every hit
  M.p[pi].hits++;
  const k = clamp(h.ly / (p.h / 2), -1, 1) * 100;
  b.vx += -h.ny * k; b.vy += h.nx * k;
  if (smashOn() && p.charge >= smashNeed() && Math.abs(p.omega) > 6) {
    // SMASH: fully charged, and the paddle was swinging fast when it met the ball
    const c = Math.hypot(b.vx, b.vy) || 1, sp = 1250 * cf().ball;
    b.vx *= sp / c; b.vy *= sp / c; b.smash = true;
    p.charge = 0; p.cool = .08; p.sv += 7; p.smearT = .22;       // motion smear is only enabled for the smash itself
    M.p[pi].sm++;
    smashFx(b);
  } else {
    b.smash = false;
    if (smashOn() && p.charge < smashNeed()) { p.charge++; if (p.charge === smashNeed() && p === mine()) sfx("ready"); }
    if (p.cool <= 0) {
      const turbo = has("speed"), warm = has("warm");
      let s = Math.min((Math.hypot(b.vx, b.vy) || 360) * (warm ? 1.08 : 1.02), (turbo ? 1000 : warm ? 860 : 740) * cf().ball);
      if (p.rot || p.power > 0) { s = Math.min(s * 1.16, (turbo ? 1150 : 860) * cf().ball); b.glow = .5; }
      const c = Math.hypot(b.vx, b.vy) || 1;
      b.vx *= s / c; b.vy *= s / c; p.cool = .08;
    }
  }
  const spd = Math.hypot(b.vx, b.vy);
  M.p[pi].top = Math.max(M.p[pi].top, spd);
  spawnVfx(b, h, b.smash ? 1.7 : 1, pi);
  squashBall(b, h.nx, h.ny, b.smash ? 1.5 : .65 + Math.min(.5, spd / 1400));
  p.ik = b.smash ? 1 : Math.min(1, .5 + spd / 1700);        // the paddle flexes (gets thinner) for a moment
  if (Math.abs(b.vx) < 150) b.vx = (b.vx < 0 ? -1 : 1) * 150;
  return true;
}

function bump(b, o) {
  const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy), m = o.r + b.r;
  if (d >= m || d < 1e-4) return;
  const nx = dx / d, ny = dy / d;
  b.x = o.x + nx * (m + .5); b.y = o.y + ny * (m + .5);
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
  const s = Math.hypot(b.vx, b.vy) || 1, t = clamp(s * 1.12, 620 * cf().ball, 820 * cf().ball);
  b.vx *= t / s; b.vy *= t / s; b.glow = .4; b.smash = false; sfx("bump");
  squashBall(b, nx, ny, 1.1);
}

function walls(b) {
  if (has("wrap")) {                                  // Wrap Around: no top or bottom walls, the ball comes out the other side
    const hh = H - wy * 2;
    if (b.y < wy - b.r) b.y += hh + b.r * 2; else if (b.y > H - wy + b.r) b.y -= hh + b.r * 2;
    return;
  }
  if (b.y - b.r < wy) { b.y = wy + b.r; if (b.vy < 0) { b.vy = -b.vy; sfx("wall"); squashBall(b, 0, 1, .75); } }
  else if (b.y + b.r > H - wy) { b.y = H - wy - b.r; if (b.vy > 0) { b.vy = -b.vy; sfx("wall"); squashBall(b, 0, -1, .75); } }
}

// A free spot in the middle of the court for a Coin Rain coin (keeps clear of whatever obstacles are on this round)
function freeSpot() {
  for (let i = 0; i < 10; i++) {
    const x = W * (.3 + Math.random() * .4), y = wy + 50 + Math.random() * (H - wy * 2 - 100);
    let ok = true;
    if (has("pillars")) PILLARS.forEach(p => { if (Math.abs(x - p.x) < p.w / 2 + 24 && Math.abs(y - p.y) < p.h / 2 + 24) ok = false; });
    if (has("bumpers")) bumpers().forEach(o => { if (Math.hypot(x - o.x, y - o.y) < o.r + 26) ok = false; });
    if (has("portal")) PORTALS.forEach(o => { if (Math.hypot(x - o.x, y - o.y) < o.r + 26) ok = false; });
    if (has("pads")) PADS.forEach(p => { if (Math.abs(x - p.x) < p.w / 2 + 24 && Math.abs(y - p.y) < p.h / 2 + 24) ok = false; });
    if (has("barrier") && Math.abs(x - W / 2) < 30) ok = false;
    if (ok) return { x, y };
  }
  return null;
}

function stepBall(b, dt) {
  if (has("slow") && Math.abs(b.x - W / 2) < SLOWW) dt *= .2;
  if (has("gravity")) {
    const dx = W / 2 - b.x, dy = H / 2 - b.y, d = Math.hypot(dx, dy);
    if (d > .001 && d < cf().gravR) {
      const f = Math.sqrt(1 - d / cf().gravR);
      const ang = Math.atan2(b.vx * dy - b.vy * dx, b.vx * dx + b.vy * dy);
      const turn = clamp(ang, -cf().gravS * f * dt, cf().gravS * f * dt);
      const c = Math.cos(turn), s = Math.sin(turn), x = b.vx;
      b.vx = x * c - b.vy * s; b.vy = x * s + b.vy * c;
    }
  }
  if (has("magnet")) {                                // paddles pull the incoming ball toward their height
    const tp = b.vx > 0 ? cpu : player, dxp = Math.abs(tp.x - b.x);
    if (b.vx * (tp.x - b.x) > 0 && dxp < 300) b.vy += clamp((tp.y - b.y) * 6, -420, 420) * (1 - dxp / 300) * dt;
  }
  if (has("speed")) { const f = 1 + .3 * dt; b.vx *= f; b.vy *= f; }
  if (has("lanes") && (b.y < wy + LANE || b.y > H - wy - LANE)) { const f = 1 + 1.1 * dt; b.vx *= f; b.vy *= f; }
  if (has("curve")) {
    const a = b.spin * 1.3 * dt, c = Math.cos(a), s = Math.sin(a), x = b.vx;
    b.vx = x * c - b.vy * s; b.vy = x * s + b.vy * c;
  }
  const cap = (b.smash ? 1500 : has("speed") ? 1100 : 860) * cf().ball, s = Math.hypot(b.vx, b.vy);
  if (s > M.top) M.top = s;
  if (s > cap) { b.vx *= cap / s; b.vy *= cap / s; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  walls(b);
  if (has("bumpers")) bumpers().forEach(o => bump(b, o));
  if (has("barrier")) bounce(b, barrier, false);
  if (has("pillars")) PILLARS.forEach(p => bounce(b, p, false));
  if (has("pads")) {
    b.pd = Math.max(0, b.pd - dt);
    if (b.pd <= 0) for (const p of PADS) {
      if (Math.abs(b.x - p.x) < p.w / 2 + b.r && Math.abs(b.y - p.y) < p.h / 2 + b.r) {
        const sp = Math.hypot(b.vx, b.vy) || 1, t = Math.min(sp * 1.35, 860 * cf().ball);
        b.vx *= t / sp; b.vy *= t / sp; b.pd = .6; b.glow = .4; sfx("bump"); break;
      }
    }
  }
  if (has("coins")) pickups = pickups.filter(c => {   // Coin Rain: touch a coin with the ball to collect it
    if (Math.hypot(b.x - c.x, b.y - c.y) > 12 + b.r + 2) return true;
    addCoins(4, c.x, c.y, false); coinBurst(c.x, c.y); sfx("coin");
    return false;
  });
  if (has("portal")) {
    b.pc = Math.max(0, b.pc - dt);
    for (let i = 0; i < 2; i++) {
      const o = PORTALS[i];
      if (b.pc <= 0 && Math.hypot(b.x - o.x, b.y - o.y) < o.r) {
        b.x = PORTALS[1 - i].x; b.y = PORTALS[1 - i].y; b.pc = .5; sfx("portal");
      }
    }
  }
  bounce(b, player, true); bounce(b, cpu, true);
  walls(b);
  b.glow = Math.max(0, b.glow - dt);
}

/* ---------- main update (solo, local 2P, and the host of an online match) ---------- */
function update(dt) {
  if (screen !== "playing") return;
  clock += dt; M.time += dt;
  wy = has("closing") ? WALL + clamp(bt * 12, 0, 160) : WALL;
  if (!twoP()) think();
  const hostOnline = net.role === "host";
  const n = Math.min(30, Math.max(1, Math.ceil(dt / .0015))), sd = dt / n;
  for (let i = 0; i < n; i++) {
    spin(player, sd);
    if (hostOnline) { tickT(cpu, sd); applyPad(); } else spin(cpu, sd);     // online: the guest's paddle comes from the guest's computer
    moveHuman(player, 0, sd, inputP1());
    if (localMode() && !online()) moveHuman(cpu, 1, sd, inputP2()); else if (!hostOnline) moveCpu(sd);
    if (ready > 0) continue;
    bt += sd;
    const A = H / 2 - WALL - 60, py = barrier.y;
    barrier.y = H / 2 - Math.cos(bt * 1.4) * A;
    barrier.vy = (barrier.y - py) / sd;
    if (has("coins")) {                                            // a new coin appears every couple of seconds and fades away if you miss it
      pickT -= sd; pickups.forEach(c => c.life -= sd); pickups = pickups.filter(c => c.life > 0);
      if (pickT <= 0 && pickups.length < 4) { pickT = 2 + Math.random() * 1.4; const sp = freeSpot(); if (sp) pickups.push({ x: sp.x, y: sp.y, life: 8, id: Math.random() * 100 }); }
    }
    let scored = null;
    for (const b of balls) {
      stepBall(b, sd);
      if (b.x < -30) { scored = "c"; break; }
      if (b.x > W + 30) { scored = "p"; break; }
    }
    if (scored) { point(scored); break; }
  }
  flex(player, dt);                                  // paddle squash & stretch
  if (hostOnline) cpu.ik = Math.max(0, cpu.ik - dt * 5.5); else flex(cpu, dt);
  if (ready > 0) {
    ready -= dt;
    if (countdown) { const n2 = Math.ceil(Math.max(ready, 0) / .8); if (n2 > 0 && n2 !== cdN) { cdN = n2; sfx("tick"); } }
  }
  balls.forEach(b => { b.ht += dt; b.roll += (b.vx * dt) / Math.max(6, b.r) * .8; b.trail.push([b.x, b.y]); if (b.trail.length > (b.smash ? 30 : 20)) b.trail.shift(); });
}

/* ---------- online play ----------
   Both players connect OUT to a free public message server (MQTT over secure WebSocket) and pass messages through it,
   so home routers and firewalls don't get in the way. The host shares a 5 character room code.
   The host runs the real game on the left. The guest controls the right paddle on their own computer
   (so it feels instant) and sends where it is; the host sends back where everything is, about 30 times a second. */
// Faster, more regular snapshots reduce remote-paddle and ball correction jitter.
const NET_STEP = .025;
const BROKERS = window.PONG_BROKERS || [
  { url: "wss://broker.emqx.io:8084/mqtt" },
  { url: "wss://test.mosquitto.org:8081" },
  { url: "wss://broker.hivemq.com:8884/mqtt" },

// HOST: opens a room on every server it can reach and waits for a friend to join on any of them
function startHost() {
  leaveNet(); net.code = "";
  if (!window.mqtt) { net.status = "COULD NOT LOAD ONLINE PLAY. CHECK YOUR INTERNET."; return; }
  const alpha = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = ""; for (let i = 0; i < 5; i++) code += alpha[Math.random() * alpha.length | 0];

    if (net.conn) { say({ t: net.conn.client === c && id === net.gid ? "welcome" : "full", id }); return; }

// GUEST: tries each server in turn until the host answers
async function startJoin(raw) {
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  leaveNet();
  if (!window.mqtt) { net.status = "COULD NOT LOAD ONLINE PLAY. CHECK YOUR INTERNET."; refreshNetUI(); return; }
  if (code.length !== 5) { net.status = "ENTER THE 5 CHARACTER ROOM CODE."; refreshNetUI(); sfx("deny"); return; }
  net.role = "guest"; net.gid = Math.random().toString(36).slice(2, 10);
  const tok = ++net.tok; let reached = 0;
  for (let i = 0; i < BROKERS.length; i++) {
    net.status = "LOOKING FOR ROOM " + code + " (SERVER " + (i + 1) + " OF " + BROKERS.length + ")..."; refreshNetUI();
    const c = await openBroker(BROKERS[i], 6000);
    if (tok !== net.tok) { if (c) c.end(true); return; }
    if (!c) continue;
    reached++;
    const r = await tryJoin(c, code, tok);
    if (tok !== net.tok) { if (c) c.end(true); return; }

  }
  leaveNet();
  net.status = reached ? "NO ROOM " + code + " FOUND. CHECK THE CODE AND MAKE SURE THE HOST IS STILL WAITING." : "CAN'T REACH ANY ONLINE SERVER. YOUR NETWORK MAY BLOCK THEM.";

    const fin = v => { if (done) return; done = true; clearInterval(iv); clearTimeout(to); res(v); };
    c.on("message", (topic, payload) => {

      let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || typeof m !== "object") return;

// Guest: take the host's picture of the game
function applySnap(s) {
  if (screen !== "playing" || !Array.isArray(s.b) || !Array.isArray(s.h) || !Array.isArray(s.g) || !Array.isArray(s.sc)) return;
  while (balls.length < s.b.length) balls.push({ x: W / 2, y: H / 2, r: 10, vx: 0, vy: 0, glow: 0, trail: [], spin: 1, pc: 0, pd: 0, smash: false, sm: 0, sa: 0, ht: 0, roll: 0 });
  balls.length = s.b.length;

  // forward by half the measured RTT, then softly correct normal drift instead of snapping
  // the ball every time its predicted position is more than 40px away.
  const lead = clamp((net.rtt || 80) * .0005, 0, .075);
  s.b.forEach((q, i) => {
    const b = balls[i];
    const tx = q[0] + q[2] * lead, ty = q[1] + q[3] * lead;
    const d = Math.hypot(tx - b.x, ty - b.y);

    if (d > 90 || reversed) b.trail = [];
    if (ready > 0 || d > 200) { b.x = tx; b.y = ty; }
    else {
      const blend = reversed ? .82 : .34;
      b.x += (tx - b.x) * blend;
      b.y += (ty - b.y) * blend;
    }

  player.ik = Math.max(player.ik, h[5]); player.charge = h[6]; player.h = h[7]; player.sk = h[8];
  player.vx = h[9]; player.vy = h[10]; player.omega = h[11];

  M.rally = s.ra | 0;

// Guest: move my own paddle right away; the ball and the host's paddle come from the latest snapshot
function updateGuest(dt) {
  clock += dt; M.time += dt;
  spin(cpu, dt);
  moveHuman(cpu, 1, dt, inputP1());

  const k = Math.min(1, dt * 30);
  player.x += (player.tx - player.x) * k; player.y += (player.ty - player.y) * k;
  // Smooth the remote paddle's rotation too; position and angle should not update in visibly different jumps.
  if (Number.isFinite(player.netAngle)) {
    const da = Math.atan2(Math.sin(player.netAngle - player.angle), Math.cos(player.netAngle - player.angle));
    player.angle += da * Math.min(1, dt * 24);
  }
  player.ik = Math.max(0, player.ik - dt * 5.5); player.gh = [];

  }
  balls.forEach(b => {
    if (ready <= 0) { b.x += b.vx * dt; b.y += b.vy * dt; }       // keep the ball moving between snapshots
    b.ht += dt; b.roll += (b.vx * dt) / Math.max(6, b.r) * .8;
    b.trail.push([b.x, b.y]); if (b.trail.length > (b.smash ? 30 : 20)) b.trail.shift();
  });

// Runs every frame: heartbeat, and the 40-per-second updates while a match is on
function netTick(real) {
  if (!net.role || !net.up) return;
  if (performance.now() - net.lastRx > 7000) { netLost("CONNECTION LOST"); return; }
  net.pingT = (net.pingT || 0) + real;
  if (net.pingT >= 1) {
    net.pingT -= 1; net.pingId = (net.pingId + 1) % 1000000; net.pingAt = performance.now();
    send({ t: "ping", id: net.pingId });
  }
  if (screen !== "playing") return;
  if (net.role === "host") net.padAge += real;
  net.snapT += real;
  if (net.snapT >= NET_STEP) { net.snapT %= NET_STEP; net.role === "host" ? sendSnap() : sendPad(); }
}

/* ---------- confetti ---------- */
let conf = [], confT = 0;
const CC = ["#d94a3a", "#d5ad54", "#f2e8c9", "#8be0a0", "#6fb7ff"];
function fxStep(dt) {
  if (!conf.length && confT <= 0) return;
  fx.clearRect(0, 0, W, H);
  if (confT > 0) {
    confT -= dt;
    for (let i = 0; i < 4; i++) conf.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 120,
      vy: 80 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - .5) * 10, s: 5 + Math.random() * 6, c: CC[Math.random() * 5 | 0] });
  }
  conf = conf.filter(p => p.y < H + 20);
  conf.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.vy += 40 * dt;
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r); fx.fillStyle = p.c; fx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fx.restore();
  });
