<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PONG // ARCADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--cream:#f2e8c9;--red:#d94a3a;--gold:#d5ad54;--phos:#3f8a5c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#11110f;color:var(--cream)}
body{display:flex;align-items:center;justify-content:center;font-family:VT323,monospace;background:radial-gradient(ellipse at center,#28271f 0,#12120f 68%,#090908 100%)}
.machine{width:min(1120px,95vw);background:#25241e;border:8px solid #0b0b09;box-shadow:0 22px 70px #000,inset 0 0 0 3px #464338;padding:26px 30px 24px}
.marquee{text-align:center;padding:5px 0 15px;border-bottom:4px solid #0c0c0b}
.marquee h1{margin:0;font-family:"Press Start 2P",monospace;font-size:clamp(20px,3.3vw,38px);color:var(--red);text-shadow:3px 3px 0 #501e19}
.marquee p{margin:10px 0 0;font-size:21px;letter-spacing:4px;color:#c8bfa5}
.screen-frame{margin:20px auto 0;padding:15px;max-width:1000px;background:#080807;border:4px solid #4b493d;box-shadow:inset 0 0 0 4px #161612,0 7px 0 #0a0a08}
.screen{position:relative;background:#182b23;overflow:hidden;container-type:inline-size}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
#fx{position:absolute;left:0;top:0;height:100%;pointer-events:none;z-index:6}
.scan,.glass{position:absolute;inset:0;pointer-events:none;z-index:7}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.14) 4px);opacity:.55}
.glass{box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.nocrt .scan,.nocrt .glass{display:none}

/* ---------- control deck under the screen ---------- */
.deck{max-width:1000px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 24px;border:3px solid #0b0b09;border-radius:8px;
  background:radial-gradient(circle at 11px 11px,#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at calc(100% - 11px) 11px,#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at 11px calc(100% - 11px),#7c7867 0 3px,#2a2923 4px,transparent 5px),radial-gradient(circle at calc(100% - 11px) calc(100% - 11px),#7c7867 0 3px,#2a2923 4px,transparent 5px),linear-gradient(#1c1b15,#12110d);
  box-shadow:inset 0 0 0 2px #3b392f,inset 0 10px 20px rgba(0,0,0,.45),0 4px 0 #0a0a08}
.instructions{font-size:20px;letter-spacing:1px;color:#bdb59e}
.instructions b{color:var(--cream);font-weight:normal}
.ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.abtn{font:20px VT323,monospace;letter-spacing:3px;color:var(--cream);background:#333229;border:2px solid #5a574a;padding:7px 22px;cursor:pointer;box-shadow:3px 3px 0 #0b0b09;transition:all .1s}
.abtn:hover{background:#403f35;border-color:var(--gold);color:var(--gold)}
.abtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0b0b09}
.abtn.paused{color:var(--gold);border-color:var(--gold)}

/* twist picker (custom dropdown) */
.pick{position:relative;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;background:#0b0b09;border:2px solid #4b493d;border-radius:7px;box-shadow:inset 0 2px 6px #000}
.pick>span{font:9px "Press Start 2P",monospace;letter-spacing:1px;color:var(--gold)}
.dd{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:210px;font:20px VT323,monospace;letter-spacing:1px;color:var(--cream);background:#201f19;border:1px solid #5a574a;border-radius:4px;padding:8px 14px;cursor:pointer;transition:all .1s}
.dd:hover,.pick.open .dd{background:#2a2922;border-color:var(--gold);color:var(--gold)}
.dd b{font-weight:normal}
.car{border:5px solid transparent;border-top:7px solid var(--gold);border-bottom:0;transition:transform .15s}
.pick.open .car{transform:rotate(180deg)}
.mpop{position:absolute;right:0;bottom:calc(100% + 12px);width:min(620px,86vw);max-height:340px;overflow-y:auto;display:none;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:#000;border:3px solid var(--phos);
  box-shadow:inset 0 0 0 2px #000,inset 0 0 0 4px #1f4d33,0 14px 44px rgba(0,0,0,.85);z-index:50;scrollbar-width:thin;scrollbar-color:#3f8a5c #000}
.mpop.open{display:grid}
.opt{padding:8px 10px;border:1px solid #1f4d33;background:#07130d;cursor:pointer;transition:all .08s;text-align:left}
.opt b{display:block;font:9px "Press Start 2P",monospace;letter-spacing:.5px;color:#bfe8cc;margin-bottom:6px;line-height:1.3}
.opt span{font-size:17px;color:#7fa890;line-height:1}
.opt:hover,.opt.hov{background:#143824;border-color:var(--gold)}
.opt:hover b,.opt.hov b{color:var(--gold)}
.opt.cur{border-color:var(--cream);background:#0f2a1c}
.opt.cur b:before{content:"";display:inline-block;margin-right:7px;border:4px solid transparent;border-left:6px solid var(--red);border-right:0}

.tweaks{max-width:1000px;margin:14px auto 0;display:none;gap:26px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:#0b0b09;border:2px solid #4b493d;border-radius:7px;box-shadow:inset 0 2px 8px #000}
.tweaks label{display:flex;align-items:center;gap:12px;font:9px "Press Start 2P",monospace;letter-spacing:1px;color:var(--gold)}
.tweaks output{min-width:2.4em;font:20px VT323,monospace;color:var(--cream)}
.tweaks input[type=range]{-webkit-appearance:none;appearance:none;width:160px;height:8px;border-radius:4px;background:#1c1b15;border:1px solid #4b493d;outline:none}
.tweaks input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:24px;border-radius:3px;border:1px solid #0b0b09;background:linear-gradient(#f4dc95,#b88a34);box-shadow:0 2px 0 #7a5a1c;cursor:pointer}
.tweaks input[type=range]::-moz-range-thumb{width:16px;height:22px;border-radius:3px;border:1px solid #0b0b09;background:linear-gradient(#f4dc95,#b88a34);box-shadow:0 2px 0 #7a5a1c;cursor:pointer}
.footer{margin-top:16px;text-align:center;color:#777365;font-size:17px;letter-spacing:2px}

/* ---------- menus & screens (sizes use cqw so everything scales with the screen) ---------- */
.ui{position:absolute;inset:0;z-index:4;display:none;font-family:VT323,monospace}
.ui.on{display:block}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sc>*{position:relative;z-index:1}
.sc>.shade{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at center,rgba(8,14,11,.45) 0,rgba(5,9,7,.9) 100%)}
.ui.retro .shade{background:rgba(0,0,0,.1)}
.sc>.rec,.sc>.hint,.sc>.ver{position:absolute}
@keyframes fade{from{opacity:0;transform:translateY(1cqw)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-4cqw) scale(1.15)}to{opacity:1;transform:none}}
@keyframes glow{50%{text-shadow:.7cqw .7cqw 0 #501e19,0 0 6cqw rgba(217,74,58,.9)}}
@keyframes blink{50%{opacity:.3}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

.bx{background:#000;border:.3cqw solid var(--phos);box-shadow:inset 0 0 0 .25cqw #000,inset 0 0 0 .4cqw #1f4d33,0 0 2.4cqw rgba(60,200,110,.18)}

.kick{padding:.7cqw 2cqw;animation:fade .8s both}
.kicker{font-family:"Press Start 2P",monospace;font-size:1.1cqw;letter-spacing:.7cqw;color:var(--gold)}
.logobox{padding:1.2cqw 3cqw 1.8cqw;margin:1.1cqw 0;animation:drop .9s cubic-bezier(.2,1.2,.3,1) both}
.logo{font-family:"Press Start 2P",monospace;font-size:14cqw;line-height:1;font-weight:normal;margin:0;letter-spacing:1cqw;color:var(--red);text-shadow:.7cqw .7cqw 0 #501e19,0 0 3.5cqw rgba(217,74,58,.55);animation:glow 3.2s ease-in-out .9s infinite}
.tagbox{padding:.6cqw 2cqw;margin-bottom:1.8cqw;animation:fade 1s .5s both}
.tag{font-size:2.2cqw;letter-spacing:.4cqw;color:#c8bfa5}
.menu{display:flex;flex-direction:column;align-items:center;animation:fade .8s .7s both}
.menu.h{flex-direction:row;gap:1.2cqw}
.mi{position:relative;font-family:"Press Start 2P",monospace;font-size:1.6cqw;padding:1.05cqw 3cqw;margin:.45cqw;min-width:26cqw;border:.3cqw solid var(--phos);background:#000;color:#bfe8cc;cursor:pointer;transition:all .12s;user-select:none}
.mi.sel{color:#000;background:var(--cream);border-color:var(--cream);transform:scale(1.05);box-shadow:0 0 2.5cqw rgba(242,232,201,.35)}
.mi.sel:before{content:"";position:absolute;left:1cqw;top:50%;margin-top:-.7cqw;border:.7cqw solid transparent;border-left:1.1cqw solid var(--red);border-right:0}
.menu.h .mi{min-width:0;font-size:1.2cqw;padding:1cqw 2.2cqw}
.menu.h .mi.sel:before{display:none}
.rec,.hint,.ver{padding:.5cqw 1.1cqw;font-size:1.8cqw;color:#9bd8b0}
.rec{left:2.5cqw;bottom:2cqw}
.sc>.hint{left:50%;transform:translateX(-50%);bottom:2cqw;animation:blink 2.2s infinite}
.ver{right:2.5cqw;bottom:2cqw;color:#6fa585}

.panel{width:88cqw;background:rgba(0,0,0,.96);border:.3cqw solid var(--phos);box-shadow:inset 0 0 0 .25cqw #000,inset 0 0 0 .4cqw #1f4d33,0 0 3cqw rgba(0,0,0,.8);padding:1.8cqw 2.4cqw;animation:fade .35s both}
.panel.narrow{width:44cqw}
.ph{font-family:"Press Start 2P",monospace;font-size:2.3cqw;font-weight:normal;color:var(--red);text-shadow:.3cqw .3cqw 0 #501e19;margin:0 0 1.2cqw;letter-spacing:.3cqw}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;text-align:left}
.gh{font-family:"Press Start 2P",monospace;font-size:.95cqw;color:var(--gold);letter-spacing:.2cqw;margin:.8cqw 0 .4cqw;border-bottom:.2cqw solid #1f4d33;padding-bottom:.5cqw}
.row{display:flex;justify-content:space-between;align-items:center;font-size:2.3cqw;padding:.25cqw 1cqw;color:#bdb59e;cursor:pointer;border-left:.4cqw solid transparent}
.row.sel{background:rgba(242,232,201,.09);border-left-color:var(--red);color:var(--cream)}
.val{display:flex;align-items:center;justify-content:space-between;gap:.8cqw;min-width:17cqw}
.val b{font-weight:normal;text-align:center;flex:1}
.ar{font-style:normal;color:var(--gold);padding:0 .8cqw;cursor:pointer;user-select:none;opacity:.35}
.row.sel .ar{opacity:1}
.row.big{width:32cqw;margin:.45cqw;padding:.8cqw 1.2cqw;border:.3cqw solid var(--phos);background:#000;color:#bfe8cc;font-size:2.2cqw;transition:all .12s}
.row.big .val{min-width:13cqw}
.row.big.sel{background:var(--cream);color:#000;border-color:var(--cream);transform:scale(1.05);box-shadow:0 0 2.5cqw rgba(242,232,201,.35)}
.row.big.sel .ar{color:#000}
.sdesc{height:2.6cqw;font-size:2.1cqw;color:var(--gold);text-align:center;margin-top:.9cqw}
.psub{font-size:2.2cqw;color:#c8bfa5;margin-bottom:1.4cqw;line-height:1.1}
.panel.narrow .mi{min-width:32cqw}
.kv{display:flex;justify-content:space-between;font-size:2.2cqw;border-bottom:.15cqw dotted #1f4d33;padding:.3cqw 0}
.kv b{font-weight:normal;color:var(--cream)}
.tip{font-size:2cqw;color:#bdb59e;margin:.5cqw 0;line-height:1.05}
.how{grid-template-columns:.8fr 1.6fr}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw 1.2cqw;max-height:29cqw;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3f8a5c transparent;padding-right:.6cqw}
.tw>div{background:rgba(31,77,51,.2);padding:.6cqw .9cqw}
.tw b{display:block;font-family:"Press Start 2P",monospace;font-weight:normal;font-size:.9cqw;color:var(--gold);margin-bottom:.35cqw}
.tw span{font-size:1.9cqw;color:#bdb59e;line-height:1}

.sc.over .bx{margin-bottom:.7cqw}
.ovt{padding:.8cqw 2.6cqw;animation:pop .7s both}
.ov-title{font-family:"Press Start 2P",monospace;font-size:5.8cqw;letter-spacing:.8cqw}
.win .ov-title{color:#ffd877;text-shadow:.5cqw .5cqw 0 #5a4313,0 0 4cqw rgba(255,216,119,.6)}
.lose .ov-title{color:var(--red);text-shadow:.5cqw .5cqw 0 #501e19,0 0 4cqw rgba(217,74,58,.5)}
.ovs{padding:.35cqw 1.6cqw;animation:fade .6s .3s both}
.ov-sub{font-size:2.2cqw;letter-spacing:.5cqw;color:#c8bfa5}
.ovsc{padding:.7cqw 3cqw;animation:fade .6s .45s both}
.ov-score{display:flex;align-items:center;gap:2.5cqw}
.nm{font-family:"Press Start 2P",monospace;font-size:1.1cqw;color:#9d957d;letter-spacing:.2cqw}
.ov-score b{font-family:"Press Start 2P",monospace;font-size:5cqw;font-weight:normal}
.dash{font-size:4cqw;color:#5a574a}
.hi{color:var(--cream)}.lo{color:#6d6853}
.ov-mid{display:flex;align-items:center;gap:2.4cqw;margin:.2cqw 0 .7cqw;animation:fade .6s .6s both}
.rank{width:10.5cqw;height:10.5cqw;border-width:.5cqw;border-style:solid;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;animation:pop .6s .9s both}
.rank small{font-family:"Press Start 2P",monospace;font-size:.85cqw;letter-spacing:.2cqw;color:#9d957d}
.rank b{font-family:"Press Start 2P",monospace;font-size:5.4cqw;font-weight:normal;line-height:1.1}
.rk-S{color:#ffd877;border-color:#ffd877;box-shadow:0 0 3cqw rgba(255,216,119,.5)}
.rk-A{color:#8be0a0;border-color:#8be0a0;box-shadow:0 0 2.4cqw rgba(139,224,160,.4)}
.rk-B{color:#9cc9ff;border-color:#9cc9ff}
.rk-C{color:#ffb35c;border-color:#ffb35c}
.rk-D{color:#ff6b5a;border-color:#ff6b5a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw}
.stat{background:#000;border:.3cqw solid var(--phos);box-shadow:inset 0 0 0 .2cqw #000,inset 0 0 0 .32cqw #1f4d33;padding:.9cqw 1.5cqw;min-width:15cqw;text-align:left}
.stat small{display:block;font-family:"Press Start 2P",monospace;font-size:.8cqw;letter-spacing:.12cqw;color:#9d957d;margin-bottom:.55cqw}
.stat b{font-family:"Press Start 2P",monospace;font-size:1.8cqw;font-weight:normal;color:var(--cream)}
.chipsbox{padding:.6cqw 1.2cqw;max-width:80cqw;animation:fade .6s .8s both}
.chips{display:flex;gap:.45cqw;justify-content:center;flex-wrap:wrap}
.chip{width:2cqw;height:2cqw;font-family:"Press Start 2P",monospace;font-size:.8cqw;display:flex;align-items:center;justify-content:center;color:#10150f}
.chip.p{background:#8be0a0}.chip.c{background:#e0675a}
.recbox{padding:.4cqw 1.4cqw;animation:fade .6s .9s both}
.recl{font-size:1.9cqw;color:#9bd8b0}
.badge{font-family:"Press Start 2P",monospace;font-size:.9cqw;letter-spacing:.2cqw;color:#10150f;background:var(--gold);padding:.35cqw .8cqw;margin-left:1cqw;animation:blink 1s infinite}

@media(max-width:700px){.machine{padding:15px 13px}.screen-frame{padding:8px}.deck{padding:14px}.mpop{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="machine">
<header class="marquee"><h1>PONG</h1><p>PLAYER VS COMPUTER</p></header>
<section class="screen-frame"><div class="screen" id="scr">
<canvas id="game" width="960" height="540"></canvas>
<div class="ui" id="ui"></div>
<canvas id="fx" width="960" height="540"></canvas>
<div class="scan"></div><div class="glass"></div>
</div></section>
<section class="deck">
<div class="instructions"><b>WASD</b>/<b>ARROWS</b> MOVE · <b>SPACE</b> ROTATE/SMASH · <b>ESC</b> PAUSE · <b>H</b> HITBOXES</div>
<div class="ctl">
<div class="pick" id="pick"><span>TWIST</span><button id="mbtn" class="dd" type="button"><b id="mtxt">CYCLE ALL</b><i class="car"></i></button><div class="mpop" id="mpop"></div></div>
<button id="pause" class="abtn"><span id="pt">PAUSE</span></button>
</div>
</section>
<section class="tweaks" id="tw">
<label data-m="bumpers">BUMPERS <input id="bn" type="range" min="1" max="8" value="4"><output id="bnv">4</output></label>
<label data-m="gravity">RADIUS <input id="gr" type="range" min="80" max="400" step="10" value="260"><output id="grv">260</output></label>
<label data-m="gravity">STRENGTH <input id="gs" type="range" min="1" max="12" value="5"><output id="gsv">5</output></label>
</section>
<div class="footer" id="foot">FIRST TO 7 &bull; EVERY ROUND HAS A NEW TWIST</div>
</main>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const cv = $("game"), ctx = cv.getContext("2d"), fx = $("fx").getContext("2d");
const W = 960, H = 540, WALL = 18, SLOWW = 200, SLOWD = .55;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const MODES = {
  normal: "CLASSIC PONG", gravity: "GRAVITY WELL", fast: "SUPER SPEED PADDLES",
  bumpers: "BUMPER MAYHEM", sticky: "STICKY PADDLES", slow: "SLOW ZONE",
  spinner: "SPINNING PADDLES", bricks: "BRICK WALLS", speed: "TURBO COURT",
  mirror: "MIRROR CONTROLS", closing: "CLOSING WALLS", portal: "PORTALS",
  ice: "ICE PADDLES", barrier: "MOVING WALL", giant: "GIANT PADDLES",
  ghost: "GHOST BALL", heavy: "HEAVY BALL", tiny: "TINY PADDLES",
  curve: "CURVEBALL", dark: "LIGHTS OUT"
};
const INFO = {
  normal: "NO GIMMICKS. JUST PONG.", gravity: "A CENTRAL WELL BENDS THE BALL'S PATH.",
  fast: "BOTH PADDLES MOVE TWICE AS FAST.", bumpers: "BOUNCY BUMPERS SUPERCHARGE THE BALL.",
  sticky: "THE BALL STICKS. AIM, THEN PRESS SPACE.", slow: "THE BALL CRAWLS THROUGH THE MIDDLE.",
  spinner: "PADDLES SPIN NONSTOP. TIME YOUR HITS.", bricks: "SMASH THROUGH THE BRICK WALLS.",
  speed: "THE BALL KEEPS GETTING FASTER.", mirror: "YOUR CONTROLS ARE REVERSED.",
  closing: "THE WALLS CLOSE IN OVER TIME.", portal: "TWO PORTALS TELEPORT THE BALL.",
  ice: "SLIPPERY PADDLES. PLAN AHEAD.", barrier: "A MOVING WALL BLOCKS THE MIDDLE.",
  giant: "ENORMOUS PADDLES.", ghost: "THE BALL VANISHES IN THE MIDDLE.",
  heavy: "A BIG, SLOW, HEAVY BALL.", tiny: "TINY PADDLES. PRECISION ONLY.",
  curve: "THE BALL CURVES THROUGH THE AIR.", dark: "LIGHTS OUT. FOLLOW THE GLOW."
};
const ORDER = Object.keys(MODES);
const pauseBtn = $("pause"), ui = $("ui");
const diff = { value: "normal" };            // current difficulty (set from the menus)
const modeSel = { value: "cycle" };          // current twist mode (set from the menus)

/* ---------- twist picker (custom dropdown) ---------- */
const pick = $("pick"), mbtn = $("mbtn"), mtxt = $("mtxt"), mpop = $("mpop");
mpop.innerHTML = [["cycle", "CYCLE ALL", "A DIFFERENT TWIST EVERY ROUND."], ...ORDER.map(k => [k, MODES[k], INFO[k]])]
  .map(([k, n, d]) => `<div class="opt" data-v="${k}" role="option"><b>${n}</b><span>${d}</span></div>`).join("");
const popOpts = () => [...mpop.querySelectorAll(".opt")];
function markPop() {
  popOpts().forEach(o => o.classList.toggle("cur", o.dataset.v === modeSel.value));
  mtxt.textContent = modeSel.value === "cycle" ? "CYCLE ALL" : MODES[modeSel.value];
}
function openPop() {
  if (screen === "playing") showScreen("pause");
  pick.classList.add("open"); mpop.classList.add("open");
  popOpts().forEach(o => o.classList.remove("hov"));
  const c = mpop.querySelector(".cur");
  if (c) mpop.scrollTop = c.offsetTop - mpop.clientHeight / 2 + c.offsetHeight / 2;
}
function closePop() { pick.classList.remove("open"); mpop.classList.remove("open"); }
function pickMode(v) {
  setS("mode", v); save(); closePop(); sfx("select");
  if (screen === "playing" || screen === "pause") startMatch();
}
mbtn.addEventListener("click", e => {
  e.stopPropagation(); mbtn.blur();
  mpop.classList.contains("open") ? closePop() : openPop();
});
mpop.addEventListener("click", e => { const o = e.target.closest(".opt"); if (o) pickMode(o.dataset.v); });
document.addEventListener("click", e => { if (!e.target.closest("#pick")) closePop(); });
function popKey(e, k) {
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "enter", " ", "escape"].includes(k)) e.preventDefault();
  const o = popOpts();
  let i = o.findIndex(x => x.classList.contains("hov"));
  if (i < 0) i = o.findIndex(x => x.classList.contains("cur"));
  if (k === "escape") { closePop(); return; }
  if (k === "enter" || k === " ") { pickMode(o[i].dataset.v); return; }
  const cols = getComputedStyle(mpop).gridTemplateColumns.split(" ").length;
  if (k === "arrowright" || k === "d") i = (i + 1) % o.length;
  else if (k === "arrowleft" || k === "a") i = (i - 1 + o.length) % o.length;
  else if (k === "arrowdown" || k === "s") i = Math.min(i + cols, o.length - 1);
  else if (k === "arrowup" || k === "w") i = Math.max(i - cols, 0);
  o.forEach((x, j) => x.classList.toggle("hov", j === i));
  const t = o[i];
  if (t.offsetTop < mpop.scrollTop) mpop.scrollTop = t.offsetTop - 8;
  else if (t.offsetTop + t.offsetHeight > mpop.scrollTop + mpop.clientHeight) mpop.scrollTop = t.offsetTop + t.offsetHeight - mpop.clientHeight + 8;
  sfx("move");
}

/* ---------- sound ---------- */
let ac = null, lastBeep = 0;
function beep(f, d = .06, type = "square", v = 1, slide = 0) {
  if (!S.vol) return;
  const now = performance.now();
  if (now - lastBeep < 12) return;
  lastBeep = now;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.value = .08 * S.vol * v;
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}
const seq = (notes, step, type, d) => notes.forEach((f, i) => setTimeout(() => beep(f, d, type), i * step));
const SFX = {
  hit: () => beep(460 + Math.random() * 70, .06), wall: () => beep(250, .05, "square", .7),
  bump: () => beep(720, .09, "triangle", 1, -300), brick: () => beep(330, .08, "sawtooth", .8, -120),
  portal: () => beep(900, .12, "sine", .9, -600), stick: () => beep(200, .07, "triangle"),
  release: () => beep(600, .08, "square", .8, 200), move: () => beep(520, .03, "square", .5),
  tick: () => beep(700, .04, "square", .6), select: () => seq([660, 880], 60, "square", .08),
  score: () => seq([520, 780], 100, "square", .12), lose: () => seq([300, 200], 120, "sawtooth", .16),
  win: () => seq([523, 659, 784, 1047], 130, "square", .2), defeat: () => seq([392, 330, 262, 196], 170, "sawtooth", .24),
  smash: () => { beep(110, .3, "sawtooth", 1.6, -60); setTimeout(() => beep(1100, .18, "square", 1, -900), 25); setTimeout(() => beep(300, .22, "triangle", 1, -200), 80); }
};
const sfx = n => SFX[n] && SFX[n]();

function predictY(b, x) {
  const t = (x - b.x) / b.vx;
  if (t <= 0) return b.y;
  const top = wy + b.r, span = H - wy - b.r - top;
  let y = (b.y + b.vy * t - top) % (2 * span);
  if (y < 0) y += 2 * span;
  if (y > span) y = 2 * span - y;
  return y + top;
}

function chooseTwist() {
  twist = modeSel.value === "cycle" ? ORDER[(round - 1) % ORDER.length] : modeSel.value;
  const h = clamp(Math.round(({ tiny: 62, giant: 180 }[twist] || 105) * S.psize), 40, 240);
  [player, cpu].forEach(p => { p.h = h; p.rot = false; p.angle = 0; p.mvx = p.mvy = 0; });
  document.querySelectorAll("#tw label").forEach(l => l.style.display = l.dataset.m === twist ? "" : "none");
  $("tw").style.display = twist === "bumpers" || twist === "gravity" ? "flex" : "none";
}

function serve(dir, first) {
  const r = twist === "heavy" ? 17 : 10;
  const sp = (twist === "heavy" ? 320 : twist === "speed" ? 520 : 390) * S.ball;
  const a = (Math.random() - .5) * .5;
  balls = [{ x: W / 2, y: H / 2, r, vx: dir * sp * Math.cos(a), vy: sp * Math.sin(a), glow: 0, trail: [],
    spin: Math.random() < .5 ? -1 : 1, pc: 0, stuck: null, stT: 0, smash: false }];
  bricks = [];
  if (twist === "bricks") for (const x of [W * .36, W * .64]) for (let i = 0; i < 8; i++)
    bricks.push({ x, y: WALL + 32 + i * 63, w: 20, h: 52, angle: 0, vx: 0, vy: 0, omega: 0, alive: true });
  countdown = !!first; ready = first ? 2.4 : .8; bt = 0; wy = WALL;
}

function startMatch() {
  scoreP = scoreC = 0; round = 1; M = newStats();
  sparks = []; rings = []; pops = []; slowT = 0; flashT = 0;
  [player, cpu].forEach(p => { p.y = H / 2; p.cool = 0; p.power = 0; p.rotCool = 0; p.smashCool = 0; });
  player.x = 62.5; cpu.x = HOME; cpuX = HOME; cpuY = H / 2; sawIncoming = false;
  chooseTwist(); serve(Math.random() < .5 ? -1 : 1, true);
  showScreen("playing");
}

function point(side) {
  side === "p" ? scoreP++ : scoreC++;
  M.hist.push({ m: twist, w: side });
  M.longest = Math.max(M.longest, M.rally); M.rally = 0;
  shakeT = .3; sfx(side === "p" ? "score" : "lose");
  if (scoreP >= S.win || scoreC >= S.win) { endMatch(); return; }
  round++; chooseTwist(); serve(side === "p" ? 1 : -1, false);
}

function endMatch() {
  const win = scoreP > scoreC, t = S.win, L = ["D", "C", "B", "A", "S"];
  let r = win ? (scoreC === 0 ? 4 : scoreC <= t * .4 ? 3 : 2) : (scoreP >= t * .6 ? 1 : 0);
  if (win) r = clamp(r + (S.diff === "hard" ? 1 : S.diff === "easy" ? -1 : 0), 2, 4);
  const newRally = M.longest > rec.rally;
  rec.games++; rec.rally = Math.max(rec.rally, M.longest);
  if (win) { rec.w++; rec.streak++; rec.best = Math.max(rec.best, rec.streak); } else { rec.l++; rec.streak = 0; }
  store.set("pong_rec", rec);
  const sub = win ? (scoreC === 0 ? "FLAWLESS VICTORY" : scoreC >= t - 1 ? "NAIL-BITING FINISH" : "WELL PLAYED")
                  : (scoreP >= t - 1 ? "SO CLOSE!" : "BETTER LUCK NEXT TIME");
  res = { win, rank: L[r], sub, newRally };
  sfx(win ? "win" : "defeat");
  showScreen("over", { fresh: true });
}

const rowHtml = (s, extra = "") => `<div class="row ${extra}" data-id="${s.id}" data-tip="${s.tip}"><span>${s.label}</span><span class="val"><i class="ar" data-d="-1">&lt;</i><b>${s.opts[optIndex(s)][0]}</b><i class="ar" data-d="1">&gt;</i></span></div>`;
function optIndex(s) {

  if (i < 0 && typeof v === "number") {
    let best = 1e9;
    s.opts.forEach((o, j) => { const d = Math.abs(o[1] - v); if (d < best) { best = d; i = j; } });

  return Math.max(i, 0);
}

function change(row, d) {
  const s = SETTINGS.find(x => x.id === row.dataset.id), n = s.opts.length;
  const i = (optIndex(s) + d + n) % n;
  setS(s.id, s.opts[i][1]);
  row.querySelector(".val b").textContent = s.opts[i][0];
  save(); sfx("tick");
}

function act(a) {
  sfx("select");
  if (a === "play" || a === "rematch" || a === "restart") startMatch();
  else if (a === "settings") { settingsFrom = screen; showScreen("settings"); }
  else if (a === "howto") showScreen("howto");
  else if (a === "howback" || a === "menu" || a === "quit") showScreen("title");
  else if (a === "back") showScreen(settingsFrom);
  else if (a === "resume") showScreen("playing");
  else if (a === "defaults") {
    SETTINGS.forEach(s => setS(s.id, DEFV[s.id])); save();
    const i = selI; renderSettings(); sel(i, true);
  }
}

function menuKey(e, k) {
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter", "escape"].includes(k)) e.preventDefault();
  if (k === "escape") {
    if (screen === "pause") act("resume"); else if (screen === "settings") act("back");
    else if (screen === "howto") act("howback"); else if (screen === "over") act("menu");
    return;
  }
  if (screen === "howto") {
    const tw = ui.querySelector(".tw");
    if (tw && (k === "arrowdown" || k === "s")) tw.scrollTop += 60;
    if (tw && (k === "arrowup" || k === "w")) tw.scrollTop -= 60;
    if (k === "enter" || k === " ") act("howback");
    return;
  }
  const cur = items()[selI], isRow = cur && cur.classList.contains("row"), horiz = cur && cur.closest(".h");
  if (k === "arrowup" || k === "w") sel(selI - 1);
  else if (k === "arrowdown" || k === "s") sel(selI + 1);
  else if (k === "arrowleft" || k === "a") { if (isRow) change(cur, -1); else if (horiz) sel(selI - 1); }
  else if (k === "arrowright" || k === "d") { if (isRow) change(cur, 1); else if (horiz) sel(selI + 1); }
  else if (k === "enter" || k === " ") { if (isRow) change(cur, 1); else if (cur) act(cur.dataset.act); }
}

/* ---------- input ---------- */
pauseBtn.onclick = () => { if (screen === "playing") showScreen("pause"); else if (screen === "pause") showScreen("playing"); };
pauseBtn.addEventListener("click", () => pauseBtn.blur());
window.addEventListener("blur", () => { if (screen === "playing") showScreen("pause"); });

window.onkeydown = e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") e.target.blur();
  const k = e.key.toLowerCase();
  if (mpop.classList.contains("open")) { popKey(e, k); return; }
  if (screen !== "playing") { menuKey(e, k); return; }
  if (k === "escape" || k === "p") { e.preventDefault(); showScreen("pause"); return; }
  keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === " " && !e.repeat) {
    if (twist === "sticky") balls.forEach(b => { if (b.stuck === player) release(b); });
    else rotate(player);
  }
  if (k === "r") startMatch();
  if (k === "h") debug = !debug;
};
window.onkeyup = e => { keys[e.key.toLowerCase()] = false; };

// Sticky mode: let go of a held ball. Moving the paddle as you release aims it.
function release(b) {
  const p = b.stuck; if (!p) return;
  const dir = p === player ? 1 : -1, sp = 520 * S.ball;
  const vy = p === cpu ? (Math.random() - .5) * 400 : clamp(p.vy * .7, -380, 380);
  b.vx = dir * Math.sqrt(sp * sp - vy * vy); b.vy = vy;
  b.stuck = null; b.smash = false; b.glow = .3; p.cool = .2; sfx("release");
}

/* ---------- paddles ---------- */
function rotate(p) {
  if (twist === "spinner" || !S.rotate) return;
  if (p.rot) { p.from = p.angle; p.to += Math.PI / 2; }      // already turning: keep going
  else { p.from = p.angle; p.to = p.angle + Math.PI / 2; p.rot = true; }
  p.t = 0; p.dur = .22;
}

function spin(p, dt) {
  p.power = Math.max(0, p.power - dt);
  p.cool = Math.max(0, p.cool - dt);
  p.rotCool = Math.max(0, p.rotCool - dt);
  p.smashCool = Math.max(0, p.smashCool - dt);
  const old = p.angle;
  if (twist === "spinner") p.angle += (p === player ? 1 : -1) * 2.4 * dt;
  else if (p.rot) {
    p.t += dt;
    const t = clamp(p.t / p.dur, 0, 1), e = 1 - Math.pow(1 - t, 3);
    p.angle = p.from + (p.to - p.from) * e;
    if (t >= 1) { p.angle = p.to; p.rot = false; p.power = .1; }
  }
  p.omega = (p.angle - old) / dt;
}

function clampPaddle(p, side) {
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  const ex = (p.w / 2) * Math.abs(c) + (p.h / 2) * Math.abs(s);
  const ey = (p.w / 2) * Math.abs(s) + (p.h / 2) * Math.abs(c);
  const br = twist === "bricks";
  p.x = side === 0 ? clamp(p.x, WALL + ex, (br ? W * .36 - 16 : W / 2 - WALL) - ex)
                   : clamp(p.x, (br ? W * .64 + 16 : W / 2 + WALL) + ex, W - WALL - ex);
  p.y = clamp(p.y, wy + ey, H - wy - ey);
}

function movePlayer(dt) {
  let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (twist === "mirror") { dx = -dx; dy = -dy; }
  const l = Math.hypot(dx, dy) || 1, sp = 480 * spdMul() * S.pspeed, ox = player.x, oy = player.y;
  let tx = dx / l * sp, ty = dy / l * sp;
  if (twist === "ice") {
    const k = Math.min(1, dt * 2.2);
    player.mvx += (tx - player.mvx) * k; player.mvy += (ty - player.mvy) * k;
    tx = player.mvx; ty = player.mvy;
  }
  player.x += tx * dt; player.y += ty * dt;
  clampPaddle(player, 0);
  player.vx = (player.x - ox) / dt; player.vy = (player.y - oy) / dt;
  if (twist === "ice") { player.mvx = player.vx; player.mvy = player.vy; }
}

function moveCpu(dt) {
  const L = LV(), sp = L.speed * spdMul(), ox = cpu.x, oy = cpu.y;
  let vx = clamp((cpuX - cpu.x) * L.gain, -sp, sp);
  let vy = clamp((cpuY - cpu.y) * L.gain, -sp, sp);
  if (twist === "ice") {
    const k = Math.min(1, dt * 2.5);
    cpu.mvx += (vx - cpu.mvx) * k; cpu.mvy += (vy - cpu.mvy) * k;
    vx = cpu.mvx; vy = cpu.mvy;
  }
  cpu.x += vx * dt; cpu.y += vy * dt;
  clampPaddle(cpu, 1);
  cpu.vx = (cpu.x - ox) / dt; cpu.vy = (cpu.y - oy) / dt;
  if (twist === "ice") { cpu.mvx = cpu.vx; cpu.mvy = cpu.vy; }
}

function think() {
  const L = LV();
  let b = balls[0];
  balls.forEach(o => { if (o.vx > 0 && (b.vx <= 0 || o.x > b.x)) b = o; });
  const incoming = b.vx > 0;
  if (incoming && !sawIncoming) {
    cpuErr = (Math.random() - .5) * 2 * L.err;
    cpuPower = L.predict && Math.random() < .35;
  }
  sawIncoming = incoming;
  if (incoming) {
    cpuY = (L.predict ? predictY(b, HOME - L.reach * .7) : b.y) + cpuErr;
    cpuX = HOME - L.reach * clamp((b.x - W * .45) / (W * .3), 0, 1);
  } else {
    if (L.recenter) cpuY = H / 2;
    cpuX = HOME;
  }
  if (twist === "spinner" || twist === "sticky") return;
  if (L.predict) {
    if (cpuPower && incoming && !cpu.rot && b.x > cpu.x - 170 && Math.abs(b.y - cpu.y) < cpu.h * .45) {
      rotate(cpu); rotate(cpu); cpuPower = false;
    }
    return;
  }
  if (cpu.rot || cpu.rotCool > 0) return;
  const sideways = Math.round(cpu.angle / (Math.PI / 2)) % 2 !== 0;
  if (incoming && !sideways && b.x > W * .62 && Math.abs(b.y - cpu.y) > cpu.h * .3 && Math.random() < L.rot) {
    rotate(cpu); cpu.rotCool = .9;
  } else if (!incoming && sideways) { rotate(cpu); cpu.rotCool = .9; }
}

/* ---------- smash effects ---------- */
function smashFx(b) {
  sfx("smash");
  if (S.slowmo) slowT = SLOWD;
  flashT = .16; shakeT = .45;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * 6.283, s = 120 + Math.random() * 420, l = .5 + Math.random() * .4;
    sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l, m: l });
  }
  rings.push({ x: b.x, y: b.y, t: 0 });
  pops.push({ x: clamp(b.x, 90, W - 90), y: b.y - 28, t: 0 });
}
function fxUpdate(dt) {
  sparks = sparks.filter(s => (s.l -= dt) > 0);
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 1 - 3 * dt; s.vy *= 1 - 3 * dt; });
  rings = rings.filter(r => (r.t += dt * 2) < 1);
  pops = pops.filter(p => (p.t += dt * 1.1) < 1);
}

/* ---------- collisions ---------- */
function hitRect(b, p) {
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  const rx = b.x - p.x, ry = b.y - p.y;
  const lx = rx * c + ry * s, ly = -rx * s + ry * c;
  const hw = p.w / 2, hh = p.h / 2;
  const dx = lx - clamp(lx, -hw, hw), dy = ly - clamp(ly, -hh, hh);
  const d = Math.hypot(dx, dy);
  if (d >= b.r) return null;
  let nx, ny, pen;
  if (d > 1e-6) { nx = dx / d; ny = dy / d; pen = b.r - d; }
  else {
    const gx = hw - Math.abs(lx), gy = hh - Math.abs(ly);
    if (gx < gy) { nx = Math.sign(lx) || 1; ny = 0; pen = gx + b.r; }
    else { nx = 0; ny = Math.sign(ly) || 1; pen = gy + b.r; }
  }
  return { nx: nx * c - ny * s, ny: nx * s + ny * c, pen, ly };
}

function bounce(b, p, isPaddle) {
  const h = hitRect(b, p);
  if (!h) return false;
  b.x += h.nx * (h.pen + .5); b.y += h.ny * (h.pen + .5);
  const rx = b.x - p.x, ry = b.y - p.y;
  const sx = p.vx - p.omega * ry, sy = p.vy + p.omega * rx;
  const vn = (b.vx - sx) * h.nx + (b.vy - sy) * h.ny;
  if (vn >= 0) return true;
  b.vx -= 2 * vn * h.nx; b.vy -= 2 * vn * h.ny;
  if (!isPaddle) return true;
  sfx("hit");
  M.rally++; M.longest = Math.max(M.longest, M.rally);
  if (p === player) M.hits++;
  const k = clamp(h.ly / (p.h / 2), -1, 1) * 100;
  b.vx += -h.ny * k; b.vy += h.nx * k;
  if (twist !== "sticky" && p.smashCool <= 0 && Math.abs(p.omega) > 6) {
    // SMASH: the paddle was swinging fast when it met the ball
    const c = Math.hypot(b.vx, b.vy) || 1, sp = 1250 * S.ball;
    b.vx *= sp / c; b.vy *= sp / c; b.smash = true;
    p.smashCool = p === player ? 1 : 2.5; p.cool = .08;
    if (p === player) M.smashes++;
    smashFx(b);
  } else {
    b.smash = false;
    if (p.cool <= 0) {
      const turbo = twist === "speed";
      let s = Math.min((Math.hypot(b.vx, b.vy) || 360) * 1.02, (turbo ? 1000 : 740) * S.ball);
      if (p.rot || p.power > 0) { s = Math.min(s * 1.16, (turbo ? 1150 : 860) * S.ball); b.glow = .5; }
      const c = Math.hypot(b.vx, b.vy) || 1;
      b.vx *= s / c; b.vy *= s / c; p.cool = .08;
    }
  }
  if (Math.abs(b.vx) < 150) b.vx = (b.vx < 0 ? -1 : 1) * 150;
  if (twist === "sticky") { b.stuck = p; b.stT = 0; sfx("stick"); }
  return true;
}

function bump(b, o) {
  const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy), m = o.r + b.r;
  if (d >= m || d < 1e-4) return;
  const nx = dx / d, ny = dy / d;
  b.x = o.x + nx * (m + .5); b.y = o.y + ny * (m + .5);
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
  const s = Math.hypot(b.vx, b.vy) || 1, t = clamp(s * 1.12, 620 * S.ball, 820 * S.ball);
  b.vx *= t / s; b.vy *= t / s; b.glow = .4; b.smash = false; sfx("bump");
}

function walls(b) {
  if (b.y - b.r < wy) { b.y = wy + b.r; if (b.vy < 0) { b.vy = -b.vy; sfx("wall"); } }
  else if (b.y + b.r > H - wy) { b.y = H - wy - b.r; if (b.vy > 0) { b.vy = -b.vy; sfx("wall"); } }
}

function stepBall(b, dt) {
  if (b.stuck) {
    const p = b.stuck, side = p === player ? 1 : -1;
    const ex = (p.w / 2) * Math.abs(Math.cos(p.angle)) + (p.h / 2) * Math.abs(Math.sin(p.angle));
    b.x = p.x + side * (ex + b.r + 1); b.y = p.y; b.vx = b.vy = 0; b.stT += dt;
    if ((p === cpu && b.stT > .55) || b.stT > 2.5) release(b);
    return;
  }
  if (twist === "slow" && Math.abs(b.x - W / 2) < SLOWW) dt *= .2;
  if (twist === "gravity") {
    const dx = W / 2 - b.x, dy = H / 2 - b.y, d = Math.hypot(dx, dy);
    if (d > .001 && d < S.gravR) {
      const f = Math.sqrt(1 - d / S.gravR);
      const ang = Math.atan2(b.vx * dy - b.vy * dx, b.vx * dx + b.vy * dy);
      const turn = clamp(ang, -S.gravS * f * dt, S.gravS * f * dt);
      const c = Math.cos(turn), s = Math.sin(turn), x = b.vx;
      b.vx = x * c - b.vy * s; b.vy = x * s + b.vy * c;
    }
  }
  if (twist === "speed") { const f = 1 + .3 * dt; b.vx *= f; b.vy *= f; }
  if (twist === "curve") {
    const a = b.spin * 1.3 * dt, c = Math.cos(a), s = Math.sin(a), x = b.vx;
    b.vx = x * c - b.vy * s; b.vy = x * s + b.vy * c;
  }
  const cap = (b.smash ? 1500 : twist === "speed" ? 1100 : 860) * S.ball, s = Math.hypot(b.vx, b.vy);
  if (s > M.top) M.top = s;
  if (s > cap) { b.vx *= cap / s; b.vy *= cap / s; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  walls(b);
  if (twist === "bumpers") bumpers().forEach(o => bump(b, o));
  if (twist === "barrier") bounce(b, barrier, false);
  if (twist === "bricks") for (const k of bricks) {
    if (!k.alive) continue;
    if (b.smash) { if (hitRect(b, k)) { k.alive = false; b.glow = .3; sfx("brick"); } }   // smashes punch through
    else if (bounce(b, k, false)) { k.alive = false; b.vx *= 1.05; b.vy *= 1.05; b.glow = .3; sfx("brick"); break; }
  }
  if (twist === "portal") {
    b.pc = Math.max(0, b.pc - dt);
    for (let i = 0; i < 2; i++) {
      const o = PORTALS[i];
      if (b.pc <= 0 && Math.hypot(b.x - o.x, b.y - o.y) < o.r) {
        b.x = PORTALS[1 - i].x; b.y = PORTALS[1 - i].y; b.pc = .5; sfx("portal");
      }
    }
  }
  bounce(b, player, true); bounce(b, cpu, true);
  walls(b);
  b.glow = Math.max(0, b.glow - dt);
}

/* ---------- main update ---------- */
function update(dt) {
  if (screen !== "playing") return;
  clock += dt; M.time += dt;
  wy = twist === "closing" ? WALL + clamp(bt * 12, 0, 160) : WALL;
  think();
  const n = Math.min(30, Math.max(1, Math.ceil(dt / .0015))), sd = dt / n;
  for (let i = 0; i < n; i++) {
    spin(player, sd); spin(cpu, sd);
    movePlayer(sd); moveCpu(sd);
    if (ready > 0) continue;
    bt += sd;
    const A = H / 2 - WALL - 60, py = barrier.y;
    barrier.y = H / 2 - Math.cos(bt * 1.4) * A;
    barrier.vy = (barrier.y - py) / sd;
    let scored = null;
    for (const b of balls) {
      stepBall(b, sd);
      if (b.x < -30) { scored = "c"; break; }
      if (b.x > W + 30) { scored = "p"; break; }
    }
    if (scored) { point(scored); break; }
  }
  if (ready > 0) ready -= dt;
  balls.forEach(b => { b.trail.push([b.x, b.y]); if (b.trail.length > (b.smash ? 30 : 20)) b.trail.shift(); });
}

/* ---------- confetti ---------- */
let conf = [], confT = 0;
const CC = ["#d94a3a", "#d5ad54", "#f2e8c9", "#8be0a0", "#6fb7ff"];
function fxStep(dt) {
  if (!conf.length && confT <= 0) return;
  fx.clearRect(0, 0, W, H);
  if (confT > 0) {
    confT -= dt;
    for (let i = 0; i < 4; i++) conf.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 120,
      vy: 80 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - .5) * 10, s: 5 + Math.random() * 6, c: CC[Math.random() * 5 | 0] });
  }
  conf = conf.filter(p => p.y < H + 20);
  conf.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.vy += 40 * dt;
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r); fx.fillStyle = p.c; fx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fx.restore();
  });
}

/* ---------- drawing ---------- */
function drawRetro(t) {          // dark green retro background for the menus
  const s = t / 1000, hz = H * .46;
  ctx.fillStyle = "#04100a"; ctx.fillRect(0, 0, W, H);
  let g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#020a06"); g.addColorStop(1, "#0f3d25");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);
  for (let i = 0; i < 46; i++) {                       // twinkling pixel stars
    ctx.fillStyle = "rgba(150,255,190," + (.2 + .4 * Math.sin(s * 2 + i * 1.7)) + ")";
    ctx.fillRect((i * 173) % W, (i * 97) % (hz - 40), 2, 2);
  }
  ctx.save(); ctx.beginPath(); ctx.arc(W / 2, hz, 170, Math.PI, 0); ctx.clip();   // striped sun
  g = ctx.createLinearGradient(0, hz - 170, 0, hz);
  g.addColorStop(0, "#2f9a5c"); g.addColorStop(1, "#14602f");
  ctx.fillStyle = g; ctx.fillRect(W / 2 - 170, hz - 170, 340, 170);
  ctx.fillStyle = "#0b2f1b";
  for (let k = 0; k < 7; k++) ctx.fillRect(W / 2 - 170, hz - 8 - k * 22, 340, 3 + (6 - k) * 1.6);
  ctx.restore();
  g = ctx.createLinearGradient(0, hz, 0, H);           // floor with a moving grid
  g.addColorStop(0, "#0d3a22"); g.addColorStop(1, "#030c07");
  ctx.fillStyle = g; ctx.fillRect(0, hz, W, H - hz);
  ctx.strokeStyle = "rgba(70,220,120,.35)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = -16; i <= 16; i++) { ctx.moveTo(W / 2 + i * 22, hz); ctx.lineTo(W / 2 + i * 120, H); }
  for (let j = 0; j < 12; j++) {
    const p = (j + (s * .6) % 1) / 12, y = hz + (H - hz) * p * p;
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.fillStyle = "rgba(90,255,150,.5)"; ctx.fillRect(0, hz - 1, W, 2);
  const v = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 640);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.65)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawPaddle(p) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
  ctx.fillStyle = "#e8dfbd"; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(-p.w / 2 + 2, -p.h / 2 + 3, 3, p.h - 6);
  if (debug) { ctx.strokeStyle = "#ff5a4a"; ctx.lineWidth = 1; ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
  ctx.restore();
}

function ring(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
}

function drawCourt() {
  ctx.fillStyle = "#193127"; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, 90, W / 2, H / 2, 650);
  v.addColorStop(0, "rgba(49,83,61,.15)"); v.addColorStop(1, "rgba(0,0,0,.42)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(218,224,188,.34)"; ctx.lineWidth = 3;
  ctx.strokeRect(WALL, WALL, W - WALL * 2, H - WALL * 2);
  ctx.setLineDash([7, 12]); ctx.beginPath(); ctx.moveTo(W / 2, WALL); ctx.lineTo(W / 2, H - WALL); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 65, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(218,224,188,.15)"; ctx.stroke();
}

function drawGame() {
  ctx.save();
  if (S.shake && shakeT > 0) { const a = shakeT * 28; ctx.translate((Math.random() - .5) * a, (Math.random() - .5) * a); }
  drawCourt();

  if (twist === "gravity") {
    ctx.beginPath(); ctx.arc(W / 2, H / 2, S.gravR, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(76,125,104,.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(198,218,177,.48)"; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 13 + Math.sin(performance.now() / 180) * 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(218,224,188,.55)"; ctx.fill();
  }
  if (twist === "slow") {
    ctx.fillStyle = "rgba(120,160,220,.09)"; ctx.fillRect(W / 2 - SLOWW, WALL, SLOWW * 2, H - WALL * 2);
    ctx.strokeStyle = "rgba(150,190,240,.3)"; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.moveTo(W / 2 - SLOWW, WALL); ctx.lineTo(W / 2 - SLOWW, H - WALL);
    ctx.moveTo(W / 2 + SLOWW, WALL); ctx.lineTo(W / 2 + SLOWW, H - WALL); ctx.stroke(); ctx.setLineDash([]);
  }
  if (twist === "portal") PORTALS.forEach((o, i) => {
    const col = i ? "#ffa24a" : "#6fb7ff";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (.45 + .15 * Math.sin(performance.now() / 160 + i)), 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.globalAlpha = .45; ctx.fill(); ctx.globalAlpha = 1;
    if (debug) ring(o.x, o.y, o.r, "#ff5a4a");
  });
  if (twist === "bumpers") bumpers().forEach(b => {
    [[b.r, "#d5ad54"], [b.r - 6, "#514b35"], [b.r - 11, "#e5d59b"]].forEach(([r, c]) => {
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
    });
    if (debug) ring(b.x, b.y, b.r, "#ff5a4a");
  });
  if (twist === "barrier") {
    ctx.fillStyle = "#d5ad54"; ctx.fillRect(barrier.x - barrier.w / 2, barrier.y - barrier.h / 2, barrier.w, barrier.h);
    if (debug) { ctx.strokeStyle = "#ff5a4a"; ctx.strokeRect(barrier.x - barrier.w / 2, barrier.y - barrier.h / 2, barrier.w, barrier.h); }
  }
  if (twist === "bricks") bricks.forEach((k, i) => {
    if (!k.alive) return;
    ctx.fillStyle = i % 2 ? "#d5ad54" : "#c9923f";
    ctx.fillRect(k.x - k.w / 2, k.y - k.h / 2, k.w, k.h);
    if (debug) { ctx.strokeStyle = "#ff5a4a"; ctx.strokeRect(k.x - k.w / 2, k.y - k.h / 2, k.w, k.h); }
  });
  if (twist === "closing" && wy > WALL) {
    ctx.fillStyle = "#0c140f"; ctx.fillRect(0, 0, W, wy); ctx.fillRect(0, H - wy, W, wy);
    ctx.fillStyle = "#d94a3a"; ctx.fillRect(0, wy - 4, W, 4); ctx.fillRect(0, H - wy, W, 4);
  }

  drawPaddle(player); drawPaddle(cpu);

  ctx.textAlign = "center";
  ctx.fillStyle = "#e9dfbd"; ctx.font = '42px "Press Start 2P"';
  ctx.fillText(scoreP, W * .43, 67); ctx.fillText(scoreC, W * .57, 67);
  ctx.font = "17px VT323"; ctx.fillStyle = "#cfc6a7";
  ctx.fillText("PLAYER", W * .25, 35); ctx.fillText("CPU", W * .75, 35);

  if (S.rotate) {                                  // smash meter under your name
    const f = 1 - clamp(player.smashCool / 1, 0, 1), c = f >= 1 ? "#ffb36b" : "#6d6853";
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(W * .25 - 46, 42, 92, 8);
    ctx.fillStyle = c; ctx.fillRect(W * .25 - 45, 43, 90 * f, 6);
    ctx.font = "15px VT323"; ctx.fillText(f >= 1 ? "SMASH READY" : "SMASH", W * .25, 64);
  }

  for (const b of balls) {
    const a = twist === "ghost" ? clamp((Math.abs(b.x - W / 2) - 40) / 150, 0, 1) : 1;
    b.trail.forEach((p, i) => {
      const t = i / b.trail.length;
      ctx.globalAlpha = t * (b.smash ? .4 : .18) * a; ctx.fillStyle = b.smash ? "#ffb36b" : "#e9dfbd";
      ctx.beginPath(); ctx.arc(p[0], p[1], b.r * t * (b.smash ? 1 : .8), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (twist === "speed" || b.smash) {
      ctx.strokeStyle = b.smash ? "rgba(255,190,120,.55)" : "rgba(230,221,184,.2)"; ctx.lineWidth = b.smash ? 2 : 1;
      for (let i = 1; i < 7; i++) {
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx * .004 * i, b.y - b.vy * .004 * i);
        ctx.lineTo(b.x - b.vx * .007 * i, b.y - b.vy * .007 * i);
        ctx.stroke();
      }
    }
    if (b.glow > 0 || b.smash) {
      ctx.save(); ctx.strokeStyle = b.smash ? "#ffb36b" : "#fff0bd"; ctx.lineWidth = 4; ctx.globalAlpha = .65 * a;
      ctx.shadowColor = b.smash ? "#ff7a2a" : "#e4bd5e"; ctx.shadowBlur = b.smash ? 26 : 18;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 10 + Math.sin(performance.now() / 40) * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = a; ctx.fillStyle = b.smash ? "#fff2dc" : "#f3e9c6"; ctx.shadowColor = b.smash ? "#ff9a4a" : "#dbe7c0"; ctx.shadowBlur = b.smash ? 16 : 8;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (debug) ring(b.x, b.y, b.r, "#5affb0");
  }

  if (twist === "dark" && balls[0]) {
    const b = balls[0], g = ctx.createRadialGradient(b.x, b.y, 40, b.x, b.y, 190);
    g.addColorStop(0, "rgba(3,8,6,0)"); g.addColorStop(1, "rgba(3,8,6,.88)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  rings.forEach(r => {                              // smash shockwaves, sparks and callouts
    ctx.strokeStyle = "rgba(255,190,110," + (1 - r.t) + ")"; ctx.lineWidth = 6 * (1 - r.t) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 130, 0, Math.PI * 2); ctx.stroke();
  });
  sparks.forEach(s => {
    const k = s.l / s.m;
    ctx.fillStyle = "rgba(255," + (150 + k * 100 | 0) + ",90," + k + ")"; ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  });
  pops.forEach(p => {
    ctx.save(); ctx.globalAlpha = 1 - p.t; ctx.font = '22px "Press Start 2P"';
    ctx.fillStyle = "#000"; ctx.fillText("SMASH!", p.x + 3, p.y - p.t * 34 + 3);
    ctx.fillStyle = "#ffb36b"; ctx.fillText("SMASH!", p.x, p.y - p.t * 34); ctx.restore();
  });

  ctx.font = '17px "Press Start 2P"'; ctx.fillStyle = "rgba(232,223,189,.72)";
  ctx.fillText("ROUND " + round + "  —  " + MODES[twist], W / 2, H - 25);

  if (ready > 0 && screen === "playing") {       // round banner and countdown
    ctx.save(); ctx.globalAlpha = clamp(ready / .35, 0, 1);
    ctx.fillStyle = "#d5ad54"; ctx.font = '14px "Press Start 2P"'; ctx.fillText("ROUND " + round, W / 2, H / 2 - 118);
    ctx.fillStyle = "#f2e8c9"; ctx.font = '26px "Press Start 2P"'; ctx.fillText(MODES[twist], W / 2, H / 2 - 78);
    ctx.fillStyle = "#c8bfa5"; ctx.font = "24px VT323"; ctx.fillText(INFO[twist], W / 2, H / 2 - 48);
    ctx.restore();
    if (countdown) { ctx.fillStyle = "#f2e8c9"; ctx.font = '56px "Press Start 2P"'; ctx.fillText(Math.ceil(ready / .8), W / 2, H / 2 + 120); }
  } else if (screen === "playing" && balls.some(b => b.stuck === player)) {
    ctx.fillStyle = "#d9d0b1"; ctx.font = '16px "Press Start 2P"';
    ctx.fillText("MOVE TO AIM - SPACE TO RELEASE", W / 2, H / 2 + 120);
  }

  if (slowT > 0) {                                 // warm vignette while time is slowed
    const k = slowT / SLOWD, g = ctx.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 620);
    g.addColorStop(0, "rgba(40,15,0,0)"); g.addColorStop(1, "rgba(40,15,0," + (.55 * k) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flashT > 0) { ctx.fillStyle = "rgba(255,240,210," + Math.min(.55, flashT * 3.5) + ")"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

function loop(t) {
  const real = Math.min((t - last) / 1000, .03);
  last = t;
  const k = slowT / SLOWD, dt = real * (slowT > 0 ? .1 + .9 * (1 - k) * (1 - k) : 1);   // slow-mo scales game time only
  slowT = Math.max(0, slowT - real); flashT = Math.max(0, flashT - real);
  if (screen === "playing") { update(dt); fxUpdate(dt); }
  shakeT = Math.max(0, shakeT - real);
  fxStep(real);
  retroOn() ? drawRetro(t) : drawGame();
  requestAnimationFrame(loop);
}

chooseTwist(); serve(1, false);
showScreen("title");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
